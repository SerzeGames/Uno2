window.addEventListener('keydown', e=>{
  const ae=document.activeElement;
  if(ae && (ae.id==='nameIn' || ae.id==='chatIn')) return;   // saisie dans un champ : pas de raccourcis jeu
  Sound.unlock();
  const k=e.key.toLowerCase();
  if(rulesOverlay && (k==='escape'||k==='enter'||k===' ')){ rulesOverlay=false; e.preventDefault(); return; }
  if(state && state.dealing){ skipDeal=true; e.preventDefault(); return; }
  if(inMenu){
    if((k==='enter'||k===' ') && !NET.screen){ settings.nomercy=false; resetSeats(); startGame(false); e.preventDefault(); }
    else if(k==='s'){ settings.stacking=!settings.stacking; }
    return;
  }
  // UNO : pré-annonce pendant le tour du joueur
  if(k==='u' && state && !state.over && state.current===0 && (state.phase==='human'||state.phase==='drewPlayable')){
    if(!state.saidUno[0]){ state.saidUno[0]=true; Sound.uno(); toast('UNO annoncé !'); if(NET.role==='client') NET.send({t:'uno'}); } e.preventDefault(); return;
  }
  // Contestation d'un oubli UNO d'une IA
  if(k==='a' && state && state.vuln && state.vuln.player!==0 && !(state.nomercy && state.eliminated[0])){
    if(NET.role==='client'){ NET.send({t:'accuse'}); e.preventDefault(); return; }
    if(state.vuln.phase==='open') resolveVuln(true,0);
    else { centerMessage("Vous n'avez pas protesté le UNO de ce joueur à temps.\nIl n'est pas pénalisé.", THEME.bad); clearVuln(); }
    e.preventDefault(); return;
  }
  if(!pending){
    if(state && state.over && (k==='enter'||k===' ') && NET.role!=='client'){ state.gameWon?startGame(false):startGame(true); e.preventDefault(); return; }
    return;
  }
  const kind=pending.kind;
  if(kind==='color'){
    const map={'1':'red','2':'yellow','3':'green','4':'blue','r':'red','j':'yellow','v':'green','b':'blue'};
    if(map[k]){ resolvePending(map[k]); e.preventDefault(); }
  } else if(kind==='challenge'){
    if(k==='c') resolvePending(true);
    else if(k==='p'||k==='enter') resolvePending(false);
  } else if(kind==='drewPlayable'){
    if(k==='g'||k==='escape') resolvePending({type:'keep'});
    else if(k==='enter'||k===' '){ const idx=hands[0].indexOf(state.drewCard); if(idx>=0) resolvePending({type:'play', idx}); e.preventDefault(); }
  } else if(kind==='turn'){
    if(k==='d'||k==='p'){ resolvePending({type:'draw'}); e.preventDefault(); }
  }
});

/* ============================================================
   Peut-on jouer cette carte (côté humain) ?
   ============================================================ */
function humanCanPlay(card){
  if(!state || state.over || state.current!==0) return false;
  if(state.phase==='drewPlayable') return card===state.drewCard && isPlayable(card, top());
  if(state.phase==='human') return isLegalPlay(card);
  return false;
}

/* ============================================================
   Pioche (avec remélange) + animation vers une main
   ============================================================ */
function reshuffleIfNeeded(){
  if(drawPile.length>0) return;
  if(discard.length<=1) return;
  const keep=discard.pop();
  const back=discard.splice(0);
  for(const c of back){ if(c.color==='wild') c.chosenColor=null; }
  drawPile=shuffle(back); discard=[keep];
  toast('La pioche est remélangée');
}
function drawOne(){ reshuffleIfNeeded(); return drawPile.length? drawPile.pop() : null; }

async function drawToHand(pi, n, reason){
  const tok=runToken;
  const drawn=[];
  for(let k=0;k<n;k++){ const card=drawOne(); if(!card) break; drawn.push(card); }
  if(drawn.length){
    netEmit({ev:'draw', seat:pi, n:drawn.length, cards:drawn.map(packCard)});
    netFlushEventsOnly();                                     // le client anime EN MÊME TEMPS (même cadence que predictDraw*)
  }
  const tgt=seatTarget(pi), dur=(drawn.length>2?150:230), stag=Math.min(dur,150);
  const proms=drawn.map((card,k)=>new Promise(res=>setTimeout(()=>{
    if(!state || tok!==runToken){ res(); return; }            // partie relancée : on abandonne (ne pas corrompre la nouvelle main)
    Sound.draw();
    animate({ type:'card', faceDown:true, key:'back',
      cx0:L.draw.x+L.draw.w/2, cy0:L.draw.y+L.draw.h/2, cx1:tgt.cx, cy1:tgt.cy,
      w0:L.cw, w1:tgt.w, r0:0, r1:tgt.rot, dur,
      onEnd:()=>{ if(state && tok===runToken){ hands[pi].push(card); cardPos[card.id]={x:tgt.cx,y:tgt.cy,w:tgt.w,rot:tgt.rot}; } res(); } });
  }, k*stag)));
  await Promise.all(proms);
  return drawn;
}

/* ============================================================
   Jouer une carte
   ============================================================ */
async function playCardBy(pi, idx){
  const hand=hands[pi], card=hand[idx];
  if(!card){ if(state) state.current=nextIdx(pi); return; }   // index devenu invalide (main modifiée : 7/0/élimination)
  const colorBefore = effColor(top());               // couleur à suivre (avant Joker +4)
  // source d'animation = position réellement affichée de la carte (évite tout saut au départ)
  const disp=cardPos[card.id];
  const src = disp ? {cx:disp.x, cy:disp.y, w:disp.w, rot:disp.rot}
                   : (layoutHand(pi, hand.length)[idx] || seatTarget(pi));
  hand.splice(idx,1);
  netEmit({ev:'play', seat:pi, card:packCard(card)});
  netFlushEventsOnly();                                     // les clients animent le jeu EN MÊME TEMPS que l'hôte
  await animatePlay(pi, card, src);
  if(!state) return;
  discard.push(card);                                      // la carte est SUR la pile dès qu'elle atterrit (avant tout choix de couleur)

  // choix couleur si Joker
  // No Mercy : les jokers Draw (+4 inversion, +6, +10) → le JOUEUR choisit la couleur maintenant.
  //            le Joker Roulette ('wild') → c'est le SUIVANT qui choisira (géré dans colorRoulette), pas de choix ici.
  const needsColorPick = state.nomercy
    ? (card.type==='wildrev4' || card.type==='wild6' || card.type==='wild10')
    : (card.type==='wild' || card.type==='wild4');
  if(needsColorPick){
    const pk=NAMES[pi], ctl=seatCtl[pi].kind;
    const askMsg = (card.type!=='wild')                    // wild4/wild6/wild10/wildrev4 → effet ; wild classique = couleur seule
      ? pk+' doit choisir une couleur\npour appliquer l\'effet de cette carte…'
      : pk+' doit choisir une couleur…';
    let color;
    if(ctl==='local'){ broadcastCenter(askMsg, THEME.gold, 20000, true); state.phase='chooseColor'; netFlush(); color = await waitInput('color'); }   // le picker recouvre le message chez l'hôte
    else if(ctl==='remote'){ broadcastCenter(askMsg, THEME.gold, 20000); state.phase='remoteColor'; color = await waitRemote(pi,'color', c=>COLORS.includes(c), aiChooseColor(hands[pi])); }
    else { broadcastCenter(askMsg, THEME.gold, 20000); await sleep(1000); color = aiChooseColor(hands[pi]); }   // l'IA « réfléchit » pour que les autres voient le message
    if(!state) return;
    card.chosenColor=color;
    netEmit({ev:'recolor', rot:card._rot, card:packCard(card)});   // met à jour la carte posée (variante colorée)
    broadcastCenter(pk+' a choisi '+COLOR_FR[color]+' !', COLOR_HEX[color], 2400);
  }
  // couleur à suivre : fixée maintenant sauf pour le Joker Roulette (le suivant la choisira)
  if(!(state.nomercy && card.type==='wild')) state.currentColor=effColor(card);
  state.phase='resolving';

  // victoire ?
  if(hand.length===0){ await endGame(pi); return; }
  // UNO : annonce ou oubli (contestable ensuite)
  if(hand.length===1) registerUno(pi);
  if(seatCtl[pi].kind!=='ai') state.saidUno[pi]=false;   // pré-annonce consommée pour ce tour
  if(state.over) return;
  // effet + avance
  await applyEffect(card, pi, colorBefore);
}

async function applyEffect(card, pi, colorBefore){
  if(state.nomercy){ await applyEffectNM(card, pi, colorBefore); return; }
  const stackOn = state.stacking;
  switch(card.type){
    case 'reverse':
      state.dir*=-1; toast('Sens inversé'); state.current=nextIdx(pi); break;
    case 'skip': {
      const sk=nextIdx(pi); toast(NAMES[sk]+' passe son tour'); state.current=nextIdx(sk); break;
    }
    case 'draw2':
      if(stackOn){ state.pendingDraw+=2; state.pendingKind='draw2'; toast('+2 · pile de '+state.pendingDraw+' en jeu'); state.current=nextIdx(pi); }
      else { const v=nextIdx(pi); toast(NAMES[v]+' pioche 2 et passe'); await drawToHand(v,2,'effect'); if(!state) return; state.current=nextIdx(v); }
      break;
    case 'wild':
      toast('Couleur : '+COLOR_FR[card.chosenColor]); state.current=nextIdx(pi); break;
    case 'wild4':
      if(stackOn){ state.pendingDraw+=4; state.pendingKind='wild4'; toast('Couleur '+COLOR_FR[card.chosenColor]+' · +4 · pile de '+state.pendingDraw); state.current=nextIdx(pi); }
      else { await resolveWild4(pi, colorBefore); }
      break;
    default:
      state.current=nextIdx(pi);
  }
}

/* ---------- Effets UNO No Mercy ---------- */
// Carte 0 : chaque joueur ENCORE EN JEU passe sa main au joueur en jeu suivant (sens du jeu).
// Les éliminés sont ignorés : on ne leur donne pas de main et on ne reçoit pas la leur.
function passHands(dir){
  const alive = (state && state.nomercy) ? [0,1,2,3].filter(k=>!state.eliminated[k]) : [0,1,2,3];
  if(alive.length<2) return;
  const nextAlive = s => { let j=(s+dir+4)%4, g=0; while(alive.indexOf(j)<0 && g++<8){ j=(j+dir+4)%4; } return j; };
  const src = hands.slice();                                  // instantané des références de main
  for(const s of alive){ hands[nextAlive(s)] = src[s]; }      // ma main → au suivant en jeu (positions gérées par l'animation)
}
function cardsMovedFor(seat){ for(const c of hands[seat]) delete cardPos[c.id]; }
// Sièges encore en jeu, ordonnés le long du sens de jeu (cycle) — pour les animations 0 et 7
function aliveRing(dir){
  const alive = (state && state.nomercy) ? [0,1,2,3].filter(k=>!state.eliminated[k]) : [0,1,2,3];
  if(alive.length<2) return alive;
  const nx = s => { let t=(s+dir+4)%4, g=0; while(alive.indexOf(t)<0 && g++<8){ t=(t+dir+4)%4; } return t; };
  const start=alive[0], ring=[start]; let j=nx(start), guard=0;
  while(j!==start && guard++<8){ ring.push(j); j=nx(j); }
  return ring;
}
// Nombre de joueurs encore en jeu (No Mercy) — 4 en classique. Sert aux règles à deux joueurs.
function aliveCount(){ return (state && state.nomercy && state.eliminated) ? [0,1,2,3].filter(k=>!state.eliminated[k]).length : 4; }
// Chaque carte vole de sa position AFFICHÉE actuelle jusqu'à son emplacement final dans sa NOUVELLE main,
// et s'y pose (échelonné par main de destination) → on voit chaque carte se placer en direct (60 fps),
// au lieu que la main entière apparaisse d'un coup. Les mains doivent déjà être réassignées par l'appelant,
// sans purge des positions (cardPos) : la source de chaque carte est son ancien emplacement affiché.
async function animateDealInto(cards, opt){
  opt=opt||{};
  cards=(cards||[]).filter(Boolean);
  if(prefersReduced || !cards.length) return;
  // 1) sources = positions affichées actuelles (capturé de façon synchrone, avant tout rendu/purge)
  const src = cards.map(card=>{
    const p=cardPos[card.id];
    return p ? {x:p.x, y:p.y, w:p.w, rot:p.rot} : {x:L.center.x, y:L.center.y, w:L.cw, rot:0};
  });
  // 2) destination = slot exact dans la nouvelle main (tableaux déjà réassignés)
  const rectsBySeat={};
  const rectsOf=s=> rectsBySeat[s] || (rectsBySeat[s]=layoutHand(s, hands[s].length));
  const dst = cards.map(card=>{
    for(let s=0;s<4;s++){ const j=hands[s].indexOf(card); if(j>=0){ const r=rectsOf(s)[j]; return {seat:s, idx:j, r}; } }
    return {seat:-1, idx:-1, r:null};
  });
  // 3) masquer ces cartes de l'éventail tant qu'elles volent
  for(const card of cards) flyingIds[card.id]=1;
  // 4) ordre d'atterrissage : par siège de destination, dans l'ordre des slots
  const delayRank={}; let maxCount=1;
  const bySeat={};
  cards.forEach((c,i)=>{ const s=dst[i].seat; (bySeat[s]=bySeat[s]||[]).push(i); });
  for(const s in bySeat){
    const arr=bySeat[s].sort((a,b)=> dst[a].idx - dst[b].idx);
    maxCount=Math.max(maxCount, arr.length);
    arr.forEach((ci,pos)=>{ delayRank[ci]=pos; });
  }
  const STAG=clamp(760/maxCount, 12, 46), DUR=Math.max(180, opt.dur||260);
  if(opt.sound!==false) Sound.special();
  const proms=cards.map((card,i)=>{
    const d=dst[i];
    if(!d.r){ delete flyingIds[card.id]; return Promise.resolve(); }
    const faceUp=(d.seat===0), tw=d.r.w||(d.seat===0?L.cw:L.ocw);
    return new Promise(res=>setTimeout(()=>{
      if(!state){ delete flyingIds[card.id]; res(); return; }        // partie relancée pendant la cascade : on abandonne proprement
      animate({ type:'card', faceDown:!faceUp, key:faceUp?spriteKey(card):'back',
        cx0:src[i].x, cy0:src[i].y, cx1:d.r.cx, cy1:d.r.cy,
        w0:src[i].w, w1:tw, r0:src[i].rot||0, r1:d.r.rot||0, dur:DUR,
        onEnd:()=>{ cardPos[card.id]={x:d.r.cx, y:d.r.cy, w:tw, rot:d.r.rot||0}; delete flyingIds[card.id]; res(); } });
    }, delayRank[i]*STAG));
  });
  await Promise.all(proms);
  for(const card of cards) delete flyingIds[card.id];   // filet de sécurité
}
// Défausse une carte : au-dessus de la pile, ou JUSTE EN DESSOUS de la carte du dessus si below=true
function insertDiscard(card, below){
  if(below && discard.length>=1) discard.splice(discard.length-1, 0, card);
  else discard.push(card);
}
// Envoie une liste de cartes de la main d'un siège vers la défausse (vols échelonnés 60 fps),
// chaque carte atterrissant SOUS la carte actuellement au sommet de la pile.
async function flyCardsToDiscard(seat, cards, opt){
  opt=opt||{}; const below=(opt.below!==false);
  cards=(cards||[]).filter(Boolean);
  if(!cards.length) return;
  if(prefersReduced){
    for(const c of cards){ const i=hands[seat].indexOf(c); if(i>=0) hands[seat].splice(i,1); delete cardPos[c.id]; insertDiscard(c, below); }
    return;
  }
  // 1) capturer la position de départ (position affichée réelle, sinon emplacement dans l'éventail)
  const rects=layoutHand(seat, hands[seat].length);
  const srcs=cards.map(card=>{
    const disp=cardPos[card.id];
    if(disp) return {cx:disp.x, cy:disp.y, w:disp.w, rot:disp.rot};
    const idx=hands[seat].indexOf(card); const r=(idx>=0&&rects[idx])?rects[idx]:seatTarget(seat);
    return {cx:r.cx, cy:r.cy, w:r.w||L.cw, rot:r.rot||0};
  });
  // 2) retirer de la main tout de suite (évite le double rendu pendant le vol)
  for(const c of cards){ const i=hands[seat].indexOf(c); if(i>=0) hands[seat].splice(i,1); delete cardPos[c.id]; }
  // 3) vols échelonnés vers la défausse
  const baseC=discardDropCenter();
  const STAG=clamp(480/cards.length, 16, 55), DUR=Math.max(150, opt.dur||220);
  Sound[opt.sound||'play']();
  const proms=cards.map((card,i)=>new Promise(res=>{
    setTimeout(()=>{
      const rot=(Math.random()*18-9)*Math.PI/180, ox=(Math.random()*14-7), oy=(Math.random()*10-5);
      animate({ type:'card', faceDown:false, key:spriteKey(card),
        cx0:srcs[i].cx, cy0:srcs[i].cy, cx1:baseC.cx+ox, cy1:baseC.cy+oy,
        w0:srcs[i].w, w1:L.discard.w, r0:srcs[i].rot||0, r1:rot, dur:DUR,
        onEnd:()=>{ card._rot=rot; insertDiscard(card, below); res(); } });
    }, i*STAG);
  }));
  await Promise.all(proms);
}
async function applyEffectNM(card, pi, colorBefore){
  const t=card.type;
  const dv=drawValue(card);
  if(dv>0){                                                 // toutes les cartes "+X" alimentent la pile empilable
    state.pendingDraw+=dv; state.pendingUnit=dv;
    let backToSelf=false;
    if(t==='wildrev4'){
      state.dir*=-1;
      backToSelf = (aliveCount()===2);                      // à 2 joueurs : l'inversion saute l'adversaire → la pile revient sur soi
      toast(backToSelf
        ? ('Inversion +4 (2 joueurs) — la pile de '+state.pendingDraw+' revient sur '+(pi===0?'vous':NAMES[pi]))
        : ('Inversion +4 · pile de '+state.pendingDraw));
    }
    else if(t==='wild6') toast('Joker +6 · pile de '+state.pendingDraw);
    else if(t==='wild10') toast('Joker +10 · pile de '+state.pendingDraw);
    else if(t==='draw4') toast('+4 · pile de '+state.pendingDraw);
    else toast('+2 · pile de '+state.pendingDraw);
    state.current = backToSelf ? pi : nextIdx(pi);          // …sinon la pile passe à l'adversaire (il empile ou encaisse)
    return;
  }
  switch(t){
    case 'reverse':
      state.dir*=-1;
      if(aliveCount()===2){ toast('Inversion = Passe (2 joueurs) — '+(pi===0?'vous rejouez':NAMES[pi]+' rejoue')); state.current=pi; }
      else { toast('Sens inversé'); state.current=nextIdx(pi); }
      break;
    case 'skip': {
      const sk=nextIdx(pi); toast(NAMES[sk]+' passe son tour'); state.current=nextIdx(sk); break;
    }
    case 'skipall':                                         // Passe tout le monde → le joueur rejoue
      toast(NAMES[pi]+' saute tout le monde et rejoue'); state.current=pi; break;
    case 'drawall': {                                       // Défausse tout : jette toutes les cartes de la couleur jouée
      const col=card.color;
      const toss=hands[pi].filter(c=>effColor(c)===col);     // la carte Discard All est déjà posée au sommet
      toast(NAMES[pi]+' défausse tout le '+COLOR_FR[col]+' ('+toss.length+')');
      netEmit({ev:'drawall', seat:pi, color:col, cards:toss.map(packCard)}); netFlushEventsOnly();   // le client anime EN MÊME TEMPS
      await flyCardsToDiscard(pi, toss, {below:true, sound:'special'});   // vol 60 fps → sous la carte Discard All jouée
      if(!state) return;
      if(hands[pi].length===0){ await endGame(pi); return; }
      state.current=nextIdx(pi); break;
    }
    case 'wild':                                            // Joker : roulette des couleurs
      await colorRoulette(pi); if(!state) return; break;
    case 'number':
      if(card.value===0){
        const order=aliveRing(state.dir);
        toast('Tous passent leur main (sens du jeu)');
        const moving=[];
        for(const s of order) for(const c of hands[s]) moving.push(c);   // toutes les cartes en jeu changent de main
        passHands(state.dir);                                            // rotation des mains (joueurs en jeu uniquement)
        netEmit({ev:'handspass', dir:state.dir}); netFlushEventsOnly();   // mains déjà tournées → le client anime EN MÊME TEMPS
        await animateDealInto(moving);                                    // chaque carte se pose dans sa nouvelle main (60 fps)
        if(!state) return;
        state.current=nextIdx(pi);
      }
      else if(card.value===7){ await sevenSwap(pi); if(!state) return; }
      else state.current=nextIdx(pi);
      break;
    default:
      state.current=nextIdx(pi);
  }
}
async function sevenSwap(pi){                                // Carte 7 : échange de main avec un joueur choisi
  const others=[0,1,2,3].filter(k=>k!==pi && !state.eliminated[k]);
  let target;
  if(others.length===0){ state.current=nextIdx(pi); return; }
  const ctl=seatCtl[pi].kind;
  if(ctl==='local'){ state.phase='chooseSwap'; state.swapOptions=others; netFlush(); target=await waitInput('swap'); state.swapOptions=null; }
  else if(ctl==='remote'){ state.phase='remoteSwap'; state.swapOptions=others; target=await waitRemote(pi,'swap', v=>others.includes(v), others[0]); state.swapOptions=null; }
  else { target = others.reduce((a,b)=> hands[b].length<hands[a].length ? b : a, others[0]); }  // IA : vise la plus petite main
  if(!state) return;
  if(!others.includes(target)) target=others[0];
  toast(NAMES[pi]+' échange sa main avec '+NAMES[target]);
  const tmp=hands[pi]; hands[pi]=hands[target]; hands[target]=tmp;   // échange des mains d'abord
  netEmit({ev:'swap', a:pi, b:target}); netFlushEventsOnly();   // mains déjà échangées → le client anime EN MÊME TEMPS
  const moving=[...hands[pi], ...hands[target]];             // toutes les cartes des deux mains changent de siège
  await animateDealInto(moving);                             // chaque carte vole vers son nouvel éventail et s'y pose (60 fps)
  if(!state) return;
  if(hands[pi].length===0){ await endGame(pi); return; }
  if(hands[target].length===0){ await endGame(target); return; }
  state.current=nextIdx(pi);
}
// Animation d'échange : deux flux de cartes se croisent en arc entre les deux joueurs
async function animateSwap(a, b){
  if(prefersReduced) return;
  const ta=seatTarget(a), tb=seatTarget(b);
  const na=hands[a].length, nb=hands[b].length;
  const cw=L.cw*0.92;
  // point de contrôle de l'arc : décalé perpendiculairement au segment a→b pour un bel arc croisé
  const mx=(ta.cx+tb.cx)/2, my=(ta.cy+tb.cy)/2;
  const dx=tb.cx-ta.cx, dy=tb.cy-ta.cy, len=Math.hypot(dx,dy)||1;
  const nxp=-dy/len, nyp=dx/len;                            // normale au segment
  const bow=Math.min(180, len*0.28);
  const swapAnims=[];
  const maxN=Math.max(na, nb), STAG=Math.min(70, 520/Math.max(1,maxN)), DUR=430;
  function launch(from, to, count, dir){
    for(let i=0;i<count;i++){
      const delay=i*STAG;
      // léger éventail de départ/arrivée pour ne pas empiler les cartes sur un seul point
      const spread=(i-(count-1)/2);
      const cxA=from.cx + spread*Math.min(10, cw*0.10), cyA=from.cy;
      const cxB=to.cx + spread*Math.min(10, cw*0.10),   cyB=to.cy;
      const ctrlx=mx + nxp*bow*dir, ctrly=my + nyp*bow*dir;
      swapAnims.push({ kind:'swapcard', t:-delay, dur:DUR,
        ax:cxA, ay:cyA, bx:cxB, by:cyB, cx:ctrlx, cy:ctrly,
        w:cw, r0:(Math.random()*20-10)*Math.PI/180, r1:(Math.random()*20-10)*Math.PI/180 });
    }
  }
  launch(ta, tb, na, +1);                                   // main de a → b (arc d'un côté)
  launch(tb, ta, nb, -1);                                   // main de b → a (arc de l'autre côté)
  state.swapFx=swapAnims;
  Sound.special();
  const total=DUR + (maxN-1)*STAG + 60;
  await sleep(total);
  state.swapFx=null;
}
// Roulette : pioche animée carte par carte (face visible) jusqu'à révéler la couleur choisie.
async function drawRevealToHand(victim, color){
  const drawn=[];
  while(drawn.length<40){ const c=drawOne(); if(!c) break; drawn.push(c); if(effColor(c)===color) break; }   // s'arrête à la couleur trouvée
  if(drawn.length){ netEmit({ev:'roulette_reveal', seat:victim, color, cards:drawn.map(packCard)}); netFlushEventsOnly(); }   // le client révèle EN MÊME TEMPS
  const tok=runToken;
  for(const c of drawn){
    const match=(effColor(c)===color), tgt=seatTarget(victim);   // recalculé : l'éventail grossit à chaque carte
    if(!prefersReduced) Sound[match?'special':'draw']();
    await animate({ type:'card', faceDown:false, key:spriteKey(c),   // face visible = révélation publique
      cx0:L.draw.x+L.draw.w/2, cy0:L.draw.y+L.draw.h/2, cx1:tgt.cx, cy1:tgt.cy,
      w0:L.cw, w1:tgt.w, r0:0, r1:tgt.rot, dur:match?300:200,
      onEnd:()=>{ if(state&&tok===runToken){ hands[victim].push(c); cardPos[c.id]={x:tgt.cx,y:tgt.cy,w:tgt.w,rot:tgt.rot}; } } });
    if(!state) return drawn.length;
  }
  return drawn.length;
}
async function colorRoulette(pi){                            // Joker Roulette : le SUIVANT choisit une couleur, révèle jusqu'à la trouver
  const victim=nextIdx(pi);
  const vname=(victim===0)?'Vous':NAMES[victim];
  let color;
  const ctl=seatCtl[victim].kind;
  if(ctl==='local'){                                         // c'est à MOI de choisir → sélecteur de couleur
    broadcastCenter(null, THEME.gold, 20000, true, NAMES[victim]+' doit choisir une couleur…');   // les autres voient le message (moi : le sélecteur)
    state.phase='rouletteColor'; state.roulette={by:pi}; netFlush();
    color=await waitInput('color'); state.roulette=null;
    if(!state) return;
    state.phase='resolving';                                 // referme le sélecteur avant la révélation animée
  } else if(ctl==='remote'){
    state.phase='remoteRoulette'; state.roulette={by:pi};
    broadcastCenter(vname+' doit choisir une couleur…', THEME.gold, 20000);
    color=await waitRemote(victim,'color', c=>COLORS.includes(c), aiChooseColor(hands[victim]));
    state.roulette=null; if(!state) return;
  } else {                                                   // IA : suspense « réflexion » quelques secondes
    broadcastCenter(vname+' doit choisir une couleur…', THEME.gold, 20000);
    await sleep(prefersReduced?0:1600);
    if(!state) return;
    color=aiChooseColor(hands[victim]);
  }
  if(!state) return;
  state.currentColor=color;                                  // la couleur choisie devient la couleur à suivre
  const rc=top(); if(rc && rc.color==='wild'){ rc.chosenColor=color; delete rc.__key; }   // la carte Roulette prend la couleur → effColor(top) = couleur à suivre pour le joueur suivant
  const chsub=(victim===0)?'Vous avez':NAMES[victim]+' a';
  broadcastCenter(chsub+' choisi '+COLOR_FR[color]+' !', COLOR_HEX[color], 2400, false, NAMES[victim]+' a choisi '+COLOR_FR[color]+' !');
  await sleep(prefersReduced?0:1100);
  if(!state) return;
  toast(vname+' révèle la pioche jusqu\'au '+COLOR_FR[color]+'…');
  const n=await drawRevealToHand(victim, color);             // pioche carte par carte, animée (aussi quand c'est contre moi) + diffusée aux clients
  if(!state) return;
  const vverb=(victim===0)?'piochez':'pioche';
  toast(vname+' '+vverb+' '+n+' carte'+(n>1?'s':'')+' — tour passé');   // la couleur trouvée n'est PAS jouée
  if(await mercyCheck()) return;
  state.current=nextIdx(victim);                             // la victime ne joue pas : son tour est sauté
}
async function drawStackAndPass(pi){
  const n=state.pendingDraw; state.pendingDraw=0; state.pendingKind=null; state.pendingUnit=0;
  toast(NAMES[pi]+' encaisse la pile : pioche '+n);
  await drawToHand(pi, n, 'effect');
  if(!state || state.over) return;
  if(state.nomercy && await mercyCheck()) return;
  state.current=nextIdx(pi);
}

async function resolveWild4(pi, colorBefore){
  const victim=nextIdx(pi);
  const hadColor = hands[pi].some(c=>c.color===colorBefore);   // aurait pu suivre ? (bluff si vrai)
  toast('Couleur : '+COLOR_FR[state.currentColor]);
  const bpart = (NAMES[pi]==='Vous') ? 'votre +4' : ('le +4 de '+NAMES[pi]);
  const askMsg = NAMES[victim]+' choisit de contester '+bpart+' ou non…';   // message pour les autres joueurs pendant la décision
  let challenge=false;
  const vctl=seatCtl[victim].kind;
  if(vctl==='local'){
    broadcastCenter(null, THEME.gold, 20000, true, askMsg);   // les autres voient le message ; moi : le panneau de contestation
    state.chal={by:pi}; state.phase='challengePrompt'; netFlush();
    challenge = await waitInput('challenge');
    state.chal=null;
  } else if(vctl==='remote'){
    broadcastCenter(askMsg, THEME.gold, 20000);               // hôte + spectateurs voient le message ; la victime voit le panneau
    state.chal={by:pi}; state.phase='remoteChallenge';
    challenge = await waitRemote(victim,'challenge', v=>typeof v==='boolean', false);
    state.chal=null;
  } else {                                                    // IA : suspense « réflexion »
    broadcastCenter(askMsg, THEME.gold, 20000);
    await sleep(prefersReduced?0:1200);
    if(!state) return;
    let p=0.16; if(hands[pi].length<=2) p+=0.16;
    challenge = Math.random()<p;
  }
  if(!state) return;
  if(challenge){
    if(hadColor){                                             // le +4 était un bluff : contestation réussie
      broadcastCenter('Contestation réussie !', THEME.gold, 2400);
      toast(NAMES[victim]+' conteste et gagne : '+NAMES[pi]+' pioche 4');
      await drawToHand(pi,4,'effect'); if(!state) return; state.current=victim;   // la victime joue normalement
    } else {                                                  // contestation injustifiée
      broadcastCenter('Contestation ratée — +6', THEME.bad, 2400);
      toast(NAMES[victim]+' conteste à tort : pioche 6'); Sound.error();
      await drawToHand(victim,6,'effect'); if(!state) return; state.current=nextIdx(victim);
    }
  } else {
    broadcastCenter('Pas de contestation', THEME.gold, 1600);
    toast(NAMES[victim]+' pioche 4 et passe');
    await drawToHand(victim,4,'effect'); if(!state) return; state.current=nextIdx(victim);
  }
}

/* ============================================================
   UNO : pré-annonce (bouton actif) + contestation (avant le tour suivant)
   ============================================================ */
const AI_DECLARE_PROB = 0.85;   // proba qu'une IA annonce "UNO" en descendant à 1 carte
const AI_NOTICE_HUMAN = 0.40;   // proba (par IA) de repérer l'oubli du joueur
const AI_NOTICE_AI    = 0.32;   // proba (par IA) de repérer l'oubli d'une autre IA

function penaltyDraw(pi,n){ const got=[]; for(let k=0;k<n;k++){ const c=drawOne(); if(c){ hands[pi].push(c); got.push(c); delete cardPos[c.id]; } } if(got.length) netEmit({ev:'penalty', seat:pi, cards:got.map(packCard)}); }

// Appelée quand un joueur descend à 1 carte : annonce OK, sinon il devient contestable
function registerUno(pi){
  const declared = (seatCtl[pi].kind==='ai') ? (Math.random()<AI_DECLARE_PROB) : state.saidUno[pi];
  if(declared){ Sound.uno(); netEmit({ev:'uno'}); toast(NAMES[pi]+' : UNO !'); if(state.vuln) clearVuln(); return; }
  // oubli → fenêtre de contestation
  if(state.vuln) clearVuln();
  let who=null;                                   // 1re IA (hors fautif) qui remarquera, si tirage réussi
  for(let k=0;k<4;k++){ if(k===pi || seatCtl[k].kind!=='ai') continue;
    if(state.nomercy && state.eliminated[k]) continue;   // un joueur éliminé ne peut pas dénoncer
    const prob=(seatCtl[pi].kind!=='ai')?AI_NOTICE_HUMAN:AI_NOTICE_AI;
    if(Math.random()<prob){ who=k; break; }
  }
  state.vuln={ player:pi, phase:'open', aiProtester:who, armed:false, aiTimer:null, deadlineTimer:null, lateTimer:null, _resolve:null };
  toast(NAMES[pi]+' n\'a pas dit UNO…');
}
function beginVulnWindow(hasDeadline){
  const v=state.vuln; if(!v||v.phase!=='open'||v.armed) return;
  v.armed=true;
  if(v.aiProtester!=null){
    const d=500+Math.random()*1400;
    v.aiTimer=setTimeout(()=>{ if(state.vuln===v && v.phase==='open') resolveVuln(true, v.aiProtester); }, d);
  }
  if(hasDeadline){
    v.deadlineTimer=setTimeout(()=>{ if(state.vuln===v && v.phase==='open') resolveVuln(false, null); }, 2600);
  }
}
function protestGate(){                            // pause avant le tour d'une IA, le temps de contester
  return new Promise(res=>{
    if(!state.vuln || state.vuln.phase!=='open'){ res(); return; }
    state.vuln._resolve=res; beginVulnWindow(true);
  });
}
function clearVulnTimers(v){ if(!v) return; if(v.aiTimer){clearTimeout(v.aiTimer);v.aiTimer=null;} if(v.deadlineTimer){clearTimeout(v.deadlineTimer);v.deadlineTimer=null;} if(v.lateTimer){clearTimeout(v.lateTimer);v.lateTimer=null;} }
function clearVuln(){ const v=state.vuln; if(v){ clearVulnTimers(v); const r=v._resolve; v._resolve=null; state.vuln=null; if(r) r(); } }
function resolveVuln(penalize, protester){
  const v=state.vuln; if(!v) return;
  const vp=v.player; clearVulnTimers(v);
  if(penalize){
    const who = (protester===0)?'Vous':NAMES[protester];
    toast(who+' : « '+NAMES[vp]+' n\'a pas dit UNO ! » → +2'); Sound.special();
    penaltyDraw(vp,2);
    clearVuln();
    netFlush();
  } else {
    v.phase='late';
    v.lateTimer=setTimeout(()=>{ if(state.vuln===v) clearVuln(); netFlush(); }, 2200);
    const r=v._resolve; v._resolve=null; if(r) r();   // libère le tour suivant
    netFlush();
  }
}
function centerMessage(text,color,ms){ ms=ms||2800; state.centerMsg={ text, color:color||THEME.bad, t0:performance.now(), until:performance.now()+ms }; }
function broadcastCenter(text,color,ms,skipLocal,netText){  // message central + diffusion immédiate aux clients (le sélecteur le recouvre chez celui qui choisit)
  if(!skipLocal) centerMessage(text,color,ms);
  netEmit({ev:'cmsg', text:netText||text, color:color||THEME.bad, ms:ms||2800});
  netFlushEventsOnly();
}

/* ============================================================
   IA
   ============================================================ */
function aiChooseColor(hand){
  const cnt={red:0,yellow:0,green:0,blue:0};
  for(const c of hand) if(c.color!=='wild') cnt[c.color]++;
  let best='red',bv=-1;
  for(const c of COLORS){ if(cnt[c]>bv){ bv=cnt[c]; best=c; } }
  if(bv===0) best=COLORS[Math.floor(Math.random()*4)];
  return best;
}
function aiPick(pi, playableIdx){
  const hand=hands[pi], nextCount=hands[nextIdx(pi)].length, attack=nextCount<=2;
  function pref(c){
    if(state.nomercy){
      if(c.type==='wild10') return attack?99:8;
      if(c.type==='wild6')  return attack?96:7;
      if(c.type==='wildrev4'){
        if(aliveCount()===2 && !hand.some(x=>x!==c && x.type!=='wildrev4' && drawValue(x)>=4)) return 2;  // à 2 joueurs, la pile revient sur soi : éviter si on ne peut pas la renvoyer
        return attack?93:6;
      }
      if(c.type==='draw4')  return attack?92:44;
      if(c.type==='draw2')  return attack?88:45;
      if(c.type==='drawall'){ const col=effColor(c); const same=hand.filter(x=>effColor(x)===col).length; return 60+same*8; }  // se débarrasser d'une couleur
      if(c.type==='skipall') return attack?86:47;
      if(c.type==='skip')    return attack?84:43;
      if(c.type==='reverse') return attack?70:41;
      if(c.type==='wild')    return attack?40:9;    // roulette : plutôt offensif
      if(c.type==='number' && c.value===7) return attack?80:30;  // 7 = vol de main
      if(c.type==='number' && c.value===0) return 34;
      return 20 + c.value;
    }
    if(c.type==='wild4') return attack?95:5;
    if(c.type==='wild')  return attack?40:9;
    if(c.type==='draw2') return attack?90:46;
    if(c.type==='skip')  return attack?85:43;
    if(c.type==='reverse')return attack?70:41;
    return 20 + c.value;                       // dumpe les gros chiffres
  }
  let best=playableIdx[0], bv=-1;
  for(const i of playableIdx){ const v=pref(hand[i]) + Math.random()*3; if(v>bv){ bv=v; best=i; } }
  return best;
}
function aiStackChoice(pi){
  const h=hands[pi];
  if(state.nomercy){
    const unit=state.pendingUnit||2;
    // relance avec la plus PETITE carte "+X" ≥ unité (conserve les grosses)
    let best=-1, bv=999;
    for(let i=0;i<h.length;i++){ const dv=drawValue(h[i]); if(dv>=unit && dv<bv){ bv=dv; best=i; } }
    return best;
  }
  let idx=h.findIndex(c=>c.type==='draw2' && canStack(c));   // conserve les +4 : préfère relancer avec un +2
  if(idx<0) idx=h.findIndex(c=>c.type==='wild4' && canStack(c));
  return idx;
}
async function aiTurn(pi){
  state.phase='ai'; draw();
  // face à une pile de + : relancer si possible, sinon encaisser
  if(state.pendingDraw>0){
    const idx=aiStackChoice(pi);
    await sleep(420);
    if(!state) return;
    if(idx>=0) await playCardBy(pi, idx);
    else await drawStackAndPass(pi);
    return;
  }
  const playableIdx = hands[pi].map((c,i)=>isPlayable(c, top())?i:-1).filter(i=>i>=0);
  if(playableIdx.length===0){
    if(state.nomercy){
      let drew=null;
      for(let g=0; g<60; g++){
        const [c]=await drawToHand(pi,1,'turn');
        if(!state || state.over) return;
        if(await mercyCheck()) return;
        if(c && isPlayable(c, top())){ drew=c; break; }
        if(!c) break;
      }
      if(drew){ await sleep(300); if(!state) return; const idx=hands[pi].indexOf(drew); await playCardBy(pi, idx); }
      else state.current=nextIdx(pi);
      return;
    }
    const [c]=await drawToHand(pi,1,'turn');
    if(!state || state.over) return;
    if(c && isPlayable(c, top())){ await sleep(320); if(!state) return; const idx=hands[pi].indexOf(c); await playCardBy(pi, idx); }
    else { toast(NAMES[pi]+' pioche'); state.current=nextIdx(pi); }
    return;
  }
  const idx=aiPick(pi, playableIdx);
  await sleep(320);
  if(!state) return;
  await playCardBy(pi, idx);
}

/* ============================================================
   Tour du joueur
   ============================================================ */
async function humanTurn(){
  const turnToken=runToken;
  state.phase='human'; state.hoverIdx=-1; state.saidUno[0]=false;   // ré-annonce à chaque tour
  if(state.vuln && state.vuln.phase==='open') beginVulnWindow(false);  // les IA peuvent contester avant que le joueur agisse
  netFlush(); draw();
  // Aucun coup possible → pioche automatique (on n'auto-pioche pas si une dénonciation « pas dit UNO » est en cours : dénoncer reste une action)
  const accuseOpen = state.vuln && state.vuln.phase==='open' && state.vuln.player!==0;
  if(!accuseOpen && !seatHasMove(0)){
    if(state.vuln && state.vuln.phase==='open') resolveVuln(false,null);
    toast(state.pendingDraw>0 ? 'Aucune relance — vous encaissez la pile' : 'Aucune carte jouable — pioche automatique');
    draw(); await sleep(600);
    if(turnToken!==runToken || !state) return;
    if(state.pendingDraw>0){ await drawStackAndPass(0); return; }   // encaisser la pile de +
    await humanDraw(); return;
  }
  while(true){
    const act=await waitInput('turn');
    // le joueur commence son tour → toute contestation non faite « passe »
    if(state.vuln && state.vuln.phase==='open') resolveVuln(false,null);
    if(act.type==='draw'){
      if(state.pendingDraw>0){ await drawStackAndPass(0); return; }   // encaisser la pile
      await humanDraw(); return;
    }
    if(act.type==='play'){
      const card=hands[0][act.idx];
      if(!card || !isLegalPlay(card)) continue;
      await playCardBy(0, act.idx); return;
    }
  }
}
async function humanDraw(){
  if(state.nomercy){
    // Pioche jusqu'à obtenir une carte jouable
    let drew=null;
    for(let g=0; g<60; g++){
      const [c]=await drawToHand(0,1,'turn');
      if(!state || state.over) return;
      if(await mercyCheck()) return;
      if(c && isPlayable(c, top())){ drew=c; break; }
      if(!c) break;
    }
    if(drew){
      state.drewCard=drew; state.phase='drewPlayable'; netFlush(); draw();
      const act=await waitInput('drewPlayable');
      state.drewCard=null;
      if(act.type==='play'){ const idx=hands[0].indexOf(drew); if(idx>=0){ await playCardBy(0, idx); return; } }
      state.current=nextIdx(0);
    } else { state.current=nextIdx(0); }
    return;
  }
  const [c]=await drawToHand(0,1,'turn');
  if(!state || state.over) return;
  if(c && isPlayable(c, top())){
    state.drewCard=c; state.phase='drewPlayable'; netFlush(); draw();
    const act=await waitInput('drewPlayable');
    state.drewCard=null;
    if(act.type==='play'){ const idx=hands[0].indexOf(c); if(idx>=0){ await playCardBy(0, idx); return; } }
  } else {
    toast('Rien à jouer, tour passé');
  }
  state.current=nextIdx(0);
}

/* ============================================================
   Tour d'un joueur distant (multijoueur, côté hôte)
   ============================================================ */
async function remoteTurn(pi){
  state.phase='remote'; state.saidUno[pi]=false;
  if(state.vuln && state.vuln.phase==='open') beginVulnWindow(false);
  draw();
  for(let guard=0; guard<40; guard++){
    state.awaitSeat=pi; state.awaitKind='turn'; netFlush();
    const act=await waitRemote(pi,'turn', a=>a&&(a.type==='draw'||(a.type==='play'&&Number.isInteger(a.idx))), {type:'draw'});
    if(!state) return;
    if(state.vuln && state.vuln.phase==='open') resolveVuln(false,null);
    if(act.type==='draw'){
      if(state.pendingDraw>0){ await drawStackAndPass(pi); return; }
      await remoteDraw(pi); return;
    }
    const card=hands[pi][act.idx];
    if(card && isLegalPlay(card)){ await playCardBy(pi, act.idx); return; }
    // action illégale → on redemande
  }
  state.current=nextIdx(pi);   // sécurité anti-boucle
}
async function remoteDraw(pi){
  if(state.nomercy){
    let drew=null;
    for(let g=0; g<60; g++){
      const [c]=await drawToHand(pi,1,'turn');
      if(!state || state.over) return;
      if(await mercyCheck()) return;
      if(c && isPlayable(c, top())){ drew=c; break; }
      if(!c) break;
    }
    if(drew){
      state.drewCard=drew; state.phase='remoteDrew';
      state.awaitSeat=pi; state.awaitKind='drewPlayable'; netFlush();
      const act=await waitRemote(pi,'drewPlayable', a=>a&&(a.type==='keep'||a.type==='play'), {type:'play'});
      if(!state) return;
      state.drewCard=null;
      if(act.type==='play'){ const idx=hands[pi].indexOf(drew); if(idx>=0){ await playCardBy(pi, idx); return; } }
    }
    state.current=nextIdx(pi); return;
  }
  const [c]=await drawToHand(pi,1,'turn');
  if(!state || state.over) return;
  if(c && isPlayable(c, top())){
    state.drewCard=c; state.phase='remoteDrew';
    state.awaitSeat=pi; state.awaitKind='drewPlayable'; netFlush();
    const act=await waitRemote(pi,'drewPlayable', a=>a&&(a.type==='keep'||a.type==='play'), {type:'keep'});
    if(!state) return;
    state.drewCard=null;
    if(act.type==='play'){ const idx=hands[pi].indexOf(c); if(idx>=0){ await playCardBy(pi, idx); return; } }
  } else {
    toast(NAMES[pi]+' pioche');
  }
  state.current=nextIdx(pi);
}

/* ============================================================
   Fin de manche
   ============================================================ */
async function endGame(pi){
  const myToken=runToken;
  if(state.nomercy){
    // Le vainqueur marque la somme des cartes restant chez les AUTRES (un éliminé a la main vide → 0),
    // + bonus Mercy Rule : 250 par joueur éliminé (leurs cartes ne comptent pas, déjà écartées à la défausse).
    let hand=0; const breakdown=[0,0,0,0];
    for(let k=0;k<4;k++){ if(k===pi) continue; let s=0; for(const c of hands[k]) s+=cardPoints(c); breakdown[k]=s; hand+=s; }
    const elimCount = state.eliminated.filter(Boolean).length;
    const elimBonus = elimCount*250;
    const total = hand + elimBonus;
    scores[pi]+=total;
    state.winner=pi; state.phase='reveal';
    state.roundPoints=total; state.breakdown=breakdown; state.elimBonus=elimBonus; state.elimCount=elimCount;
    state.gameWon = (state.target==='round') || (scores[pi] >= (typeof state.target==='number'?state.target:1000));
    const alive=[0,1,2,3].filter(k=>!state.eliminated[k]);
    const lastMan = alive.length<=1 && hands[pi].length>0;
    Sound.win();
    toast((lastMan ? (NAMES[pi]+' est le dernier en jeu') : (pi===0?'Vous videz votre main':(NAMES[pi]+' vide sa main'))) + ' — +'+total+' pts');
    netEmit({ev:'reveal', hands:hands.map(h=>h.map(packCard)), win:true});
    await revealOpponents();
    if(myToken!==runToken) return;
    state.over=true; state.phase='over'; netFlush();
    return;
  }
  // Points : somme de la valeur des cartes restantes chez les autres joueurs
  let total=0; const breakdown=[0,0,0,0];
  for(let k=0;k<4;k++){ if(k===pi) continue; let s=0; for(const c of hands[k]) s+=cardPoints(c); breakdown[k]=s; total+=s; }
  scores[pi]+=total;
  state.winner=pi; state.phase='reveal';
  state.roundPoints=total; state.breakdown=breakdown;
  state.gameWon = (state.target==='round') || (scores[pi] >= (typeof state.target==='number'?state.target:Infinity));
  Sound.win();
  toast(pi===0 ? ('Vous videz votre main ! +'+total+' pts') : (NAMES[pi]+' termine la manche (+'+total+' pts)'));
  netEmit({ev:'reveal', hands:hands.map(h=>h.map(packCard)), win:true});
  // Révèle les cartes restantes des adversaires (flip), puis affiche les scores
  await revealOpponents();
  if(myToken!==runToken) return;                     // manche abandonnée pendant la révélation
  state.over=true; state.phase='over';
  netFlush();
}
async function revealOpponents(){
  let maxCards=0; for(let k=1;k<4;k++) maxCards=Math.max(maxCards, hands[k].length);
  if(maxCards===0) return;                            // rien à révéler
  state.revealing=true;
  state.revealStart = prefersReduced ? -1e9 : performance.now();   // instantané si reduced-motion
  if(prefersReduced) return;
  Sound.special();
  await sleep((maxCards-1)*REVEAL_STAGGER + REVEAL_FLIP + 320);     // flip + petite pause pour bien voir
}

/* ============================================================
   Boucle principale
   ============================================================ */
async function gameLoop(myToken){
  while(!state.over){
    if(myToken!==runToken) return;                 // une nouvelle partie a été lancée
    if(state.nomercy && state.eliminated[state.current]){ state.current=nextIdx(state.current); continue; }  // saute les éliminés
    state.turnCounter++;
    const p=state.current, ctl=seatCtl[p].kind;
    // Avant le tour d'une IA : fenêtre de contestation si quelqu'un a oublié UNO au coup précédent
    if(ctl==='ai' && state.vuln && state.vuln.phase==='open'){ await protestGate(); if(myToken!==runToken) return; }
    state.awaitSeat=-1; state.awaitKind=null;
    draw();
    if(seatCtl[p].kind==='local'){ await humanTurn(); }
    else {
      await sleep(seatCtl[p].kind==='remote'?120:460);
      if(myToken!==runToken||!state) return;
      // relit le contrôleur APRÈS le sleep : le siège a pu passer en IA (déconnexion pendant l'attente)
      if(seatCtl[p].kind==='remote'){ await remoteTurn(p); }
      else {
        if(state.vuln && state.vuln.phase==='open'){ await protestGate(); if(myToken!==runToken||!state) return; }
        await aiTurn(p);
      }
    }
    if(myToken!==runToken||!state) return;
    netFlush();
  }
  if(myToken!==runToken) return;
  draw();
}

/* ============================================================
   Démarrage d'une manche
   ============================================================ */
async function dealAnimation(first, myToken){
  const dc={ cx:L.draw.x+L.draw.w/2, cy:L.draw.y+L.draw.h/2 };
  const stagger = prefersReduced?0:46, DUR=300;
  outer:
  for(let r=0;r<7;r++){
    for(let p=0;p<4;p++){
      if(myToken!==runToken) return;
      if(skipDeal) break outer;
      const card=hands[p][r], rect=layoutHand(p,7)[r];
      Sound.deal();
      animate({ type:'card', deal:true, faceDown:(p!==0), key:(p===0?spriteKey(card):'back'),
        cx0:dc.cx, cy0:dc.cy, cx1:rect.cx, cy1:rect.cy, w0:L.cw*0.86, w1:rect.w,
        r0:(Math.random()*0.5-0.25), r1:rect.rot, dur:DUR,
        onEnd:()=>{ if(state) state.revealed[p]++; } });
      if(stagger) await sleep(stagger);
    }
  }
  if(skipDeal){ anims=anims.filter(a=>!a.deal); state.revealed=[7,7,7,7]; }
  else if(!prefersReduced){ await sleep(DUR+30); }
  if(myToken!==runToken) return;
  // retourne la 1re carte de la défausse (animée)
  first._rot=(Math.random()*8-4)*Math.PI/180;
  if(skipDeal || prefersReduced){ discard.push(first); }
  else {
    Sound.play();
    await animate({ type:'card', faceDown:false, key:spriteKey(first),
      cx0:dc.cx, cy0:dc.cy, cx1:L.discard.x+L.discard.w/2, cy1:L.discard.y+L.discard.h/2,
      w0:L.cw, w1:L.cw, r0:0, r1:first._rot, dur:300, onEnd:()=>{ discard.push(first); } });
  }
}
async function startGame(continueMatch){
  runToken++; const myToken=runToken;
  if(state && state.vuln) clearVuln();             // annule une contestation en cours
  if(!continueMatch){ for(let i=0;i<4;i++) scores[i]=0; }   // nouvelle partie : scores remis à 0
  const nm = !!settings.nomercy;
  CARD_ID=1;
  drawPile = nm ? buildDeckNM() : buildDeck(); discard=[];
  hands=[[],[],[],[]];
  for(let r=0;r<7;r++) for(let p=0;p<4;p++) hands[p].push(drawPile.pop());
  // 1re carte défausse = un chiffre simple (évite les cas particuliers du 1er tour)
  let first=drawPile.pop(), guard=0;
  while((first.type!=='number' || (nm && (first.value===0||first.value===7))) && guard++<400){ drawPile.unshift(first); shuffle(drawPile); first=drawPile.pop(); }
  anims=[]; pending=null; inMenu=false; rulesOverlay=false; skipDeal=false; cardPos={};
  state={
    current:0, dir:1, currentColor:null, nomercy:nm,
    phase:'dealing', dealing:true, revealed:[0,0,0,0],
    over:false, winner:-1, hoverIdx:-1,
    turnCounter:0, drewCard:null, chal:null,
    saidUno:[false,false,false,false], vuln:null, centerMsg:null,
    stacking: nm ? true : settings.stacking, mix:settings.mix,      // No Mercy empile toujours
    pendingDraw:0, pendingKind:null, pendingUnit:0,
    eliminated:[false,false,false,false], swapOptions:null, roulette:null, swapFx:null,
    target: nm ? (settings.targetSet ? settings.target : 1000) : settings.target, roundPoints:0, breakdown:null, gameWon:false,
    revealing:false, revealStart:0,
    awaitSeat:-1, awaitKind:null, drawCountView:null
  };
  if(NET.role==='host') netRoundStart(first);          // les clients lancent leur donne en parallèle
  toast(nm ? 'UNO No Mercy — distribution…' : (settings.stacking ? ('Stacking '+(settings.mix?'· mélange total':'· sans mélange')) : 'Distribution…'));
  await dealAnimation(first, myToken);
  if(myToken!==runToken) return;                       // partie annulée (retour menu / nouvelle donne)
  state.currentColor=effColor(first);
  state.dealing=false; state.phase='human';
  toast('À vous de jouer');
  netFlush();
  gameLoop(myToken);
}

/* ============================================================
   MULTIJOUEUR EN LIGNE (PeerJS) — hôte autoritaire
   - Partie rapide : scan de salons fixes ; si aucun hôte joignable, on crée le salon.
   - L'hôte exécute le moteur ; les clients envoient leurs intentions, l'hôte valide,
     puis diffuse à chacun une vue filtrée (sièges réindexés : chacun se voit en bas)
     + les événements d'animation. Les sièges vides sont tenus par les IA.
   ============================================================ */
let PeerCtor = (typeof Peer!=='undefined') ? Peer : null;
const MM_PREFIX='serze-uno-mm-v1-', MM_SLOTS=6, PROTO=1;
const AI_POOL=['Colt','Rosa','Django'];
const NET = {
  role:'off',            // off | host | client
  screen:null,           // null | pseudo | searching | lobby | error
  intent:'search',       // search (partie rapide) | create (créer une partie)
  status:'', errMsg:'',
  peer:null, conn:null,          // client
  players:[],                    // hôte : [{seat,name,conn|null(local)}]
  lobby:null,                    // client : {you, players, rules}
  matchStarted:false, chat:[],
  pred:{ plays:{}, draw:0 },            // actions optimistes côté client (anti-latence)
  rawEvs:[], q:[], busy:false, lastSeen:0, hbT:null,
  T:{ scan:3500, act:45000, hb:4000, dead:15000 }
};
function genName(){ const A=['Butch','Wyatt','Belle','Jesse','Doc','Calamity','Sundance','Maverick','Dusty','Ringo']; return A[Math.random()*A.length|0]+'-'+(100+Math.random()*900|0); }
function loadName(){ try{ const v=localStorage.getItem('serzeUnoName'); if(v && v.trim()) return v.trim().slice(0,14); }catch(e){} return genName(); }
function saveName(n){ try{ localStorage.setItem('serzeUnoName', n); }catch(e){} }
let myName = loadName();

/* ---------- champs DOM superposés (pseudo / tchat) ---------- */
const domIn = { name:null, chat:null, lastCss:{} };
function getIn(id){ const el=document.getElementById(id); return (el && 'value' in el) ? el : null; }
function initDomInputs(){
  domIn.name=getIn('nameIn'); domIn.chat=getIn('chatIn');
  if(domIn.name){
    domIn.name.addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key==='Enter') netGoSearch(); });
  }
  if(domIn.chat){
    domIn.chat.addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key==='Enter'){ chatSend(domIn.chat.value); domIn.chat.value=''; } });
  }
}
function placeInput(el, key, rect){                       // rect null → cache ; sinon positionne (px CSS)
  if(!el || !el.style) return;
  const css = rect ? ('display:block;left:'+rect.x+'px;top:'+rect.y+'px;width:'+rect.w+'px;height:'+rect.h+'px;') : 'display:none;';
  if(domIn.lastCss[key]===css) return;
  domIn.lastCss[key]=css;
  el.style.display = rect?'block':'none';
  if(rect){ el.style.left=rect.x+'px'; el.style.top=rect.y+'px'; el.style.width=rect.w+'px'; el.style.height=rect.h+'px'; }
}
let chatRect=null, nameRect=null;                          // calculés par les fonctions de dessin, appliqués chaque frame
function syncDomInputs(){
  placeInput(domIn.name,'name', (inMenu && NET.screen==='pseudo') ? nameRect : null);
  const chatOn = !inMenu && state && state.over && NET.role!=='off';
  placeInput(domIn.chat,'chat', chatOn ? chatRect : null);
}
function packCard(c){ return { id:c.id, color:c.color, type:c.type, value:c.value, chosenColor:c.chosenColor||null, k:spriteKey(c), rot:c._rot||0 }; }
function unpackCard(p){ return { id:p.id, color:p.color, type:p.type, value:p.value, chosenColor:p.chosenColor, __key:p.k, _rot:p.rot||0 }; }
function rotSeat(real, viewer){ return ((real - viewer) % 4 + 4) % 4; }

/* ---------- côté hôte : événements + diffusion ---------- */
function netEmit(ev){ if(NET.role==='host') NET.rawEvs.push(ev); }
function buildViewFor(viewer){
  const v={ names:[], counts:[], scores:[], dealing:!!state.dealing, nomercy:!!state.nomercy,
    current:rotSeat(state.current,viewer), dir:state.dir, currentColor:state.currentColor,
    top4:discard.slice(-4).map(packCard), drawCount:drawPile.length,
    pendingDraw:state.pendingDraw, pendingKind:state.pendingKind, pendingUnit:state.pendingUnit||0,
    stacking:state.stacking, mix:state.mix, target:state.target,
    elim: state.eliminated ? [0,1,2,3].map(k=>state.eliminated[(viewer+k)%4]) : [false,false,false,false],
    myHand:hands[viewer].map(packCard), saidMe:!!state.saidUno[viewer],
    vuln: state.vuln?{player:rotSeat(state.vuln.player,viewer), phase:state.vuln.phase}:null,
    over:state.over, gameWon:state.gameWon, winner:state.winner>=0?rotSeat(state.winner,viewer):-1,
    roundPoints:state.roundPoints, elimBonus:state.elimBonus||0, elimCount:state.elimCount||0, revealing:!!state.revealing, await:null };
  for(let k=0;k<4;k++){ const r=(viewer+k)%4; v.names.push(NAMES[r]); v.counts.push(hands[r].length); v.scores.push(scores[r]); }
  if(state.awaitSeat===viewer && state.awaitKind){
    v.await={kind:state.awaitKind};
    if(state.awaitKind==='drewPlayable' && state.drewCard) v.await.drewId=state.drewCard.id;
    if(state.awaitKind==='challenge' && state.chal) v.await.chalBy=rotSeat(state.chal.by,viewer);
    if(state.awaitKind==='swap' && state.swapOptions) v.await.swap=state.swapOptions.map(s=>rotSeat(s,viewer));
    if(state.awaitKind==='color' && state.roulette) v.await.roulette=true;   // roulette : le suivant choisit (picker roulette)
  }
  return v;
}
function rotEvsFor(seat, evs){
  const revs=[];
  for(const ev of evs){
    if(ev.ev==='penalty') continue;                       // couvert par la vue
    if(ev.ev==='reveal'){ revs.push({ev:'reveal', hands:[0,1,2,3].map(k=>ev.hands[(seat+k)%4])}); continue; }
    if(ev.ev==='handspass'){ const e2=Object.assign({},ev); e2.myNewHand=hands[seat].map(packCard); e2.counts=[0,1,2,3].map(k=>hands[(seat+k)%4].length); revs.push(e2); continue; }   // 0 : ma nouvelle main + comptes tournés
    if(ev.ev==='swap'){ const e2=Object.assign({},ev); e2.a=rotSeat(ev.a,seat); e2.b=rotSeat(ev.b,seat); if(seat===ev.a||seat===ev.b) e2.myNewHand=hands[seat].map(packCard); e2.counts=[0,1,2,3].map(k=>hands[(seat+k)%4].length); revs.push(e2); continue; }   // 7 : nouvelle main pour les 2 concernés
    const e=Object.assign({}, ev);
    if('seat' in e) e.seat=rotSeat(ev.seat, seat);
    if('a' in e) e.a=rotSeat(ev.a, seat);                 // swap : deux sièges
    if('b' in e) e.b=rotSeat(ev.b, seat);
    if(ev.ev==='draw' && e.seat!==0) delete e.cards;      // cartes privées : seulement pour le piocheur
    revs.push(e);
  }
  return revs;
}
function netFlush(){
  if(NET.role!=='host' || !state) return;
  const evs=NET.rawEvs; NET.rawEvs=[];
  for(const pl of NET.players){
    if(!pl.conn) continue;                                 // hôte local
    try{ pl.conn.send({t:'q', evs:rotEvsFor(pl.seat, evs), view:buildViewFor(pl.seat)}); }catch(err){}
  }
}
// Envoie tout de suite les événements d'animation en attente SANS la vue (état diffusé en fin de tour) :
// permet aux clients d'animer EN MÊME TEMPS que l'hôte, pas après son animation.
function netFlushEventsOnly(){
  if(NET.role!=='host' || !state) return;
  const evs=NET.rawEvs; if(!evs.length) return; NET.rawEvs=[];
  for(const pl of NET.players){
    if(!pl.conn) continue;
    try{ pl.conn.send({t:'q', evs:rotEvsFor(pl.seat, evs), view:null}); }catch(err){}
  }
}
function netRoundStart(first){
  if(NET.role!=='host') return;
  for(const pl of NET.players){
    if(!pl.conn) continue;
    const names=[],counts=[],sc=[];
    for(let k=0;k<4;k++){ const r=(pl.seat+k)%4; names.push(NAMES[r]); counts.push(hands[r].length); sc.push(scores[r]); }
    try{ pl.conn.send({t:'q', evs:[{ev:'roundStart', names, counts, scores:sc, nomercy:!!state.nomercy,
      myHand:hands[pl.seat].map(packCard), first:packCard(first), drawCount:drawPile.length,
      stacking:state.stacking, mix:state.mix, target:state.target}], view:null}); }catch(err){}
  }
}

/* ---------- tchat de fin de manche (relayé par l'hôte, visible sur l'écran des scores) ---------- */
function chatPush(from, text){
  NET.chat.push({from, text});
  if(NET.chat.length>40) NET.chat.splice(0, NET.chat.length-40);
}
function hostChat(from, text){                             // hôte : valide, stocke, diffuse
  text=String(text||'').replace(/\s+/g,' ').trim().slice(0,120);
  if(!text) return;
  if(!state || !state.over) return;                        // uniquement pendant l'écran des scores (anti-triche)
  chatPush(from, text);
  for(const p of NET.players){ if(p.conn){ try{ p.conn.send({t:'chatMsg', from, text}); }catch(e){} } }
}
function chatSend(text){
  text=String(text||'').replace(/\s+/g,' ').trim().slice(0,120);
  if(!text || NET.role==='off' || !state || !state.over) return;
  if(NET.role==='host') hostChat(myName, text);
  else NET.send({t:'chat', text});
}

/* ---------- côté hôte : attente d'une action distante ---------- */
const remotePending={};                                     // seat -> {kind,res,valid,def,timer}
function waitRemote(seat, kind, valid, def){
  if(seatCtl[seat].kind!=='remote') return Promise.resolve(def);   // le siège vient d'être converti en IA (déconnexion)
  state.awaitSeat=seat; state.awaitKind=kind; netFlush();
  return new Promise(res=>{
    let timer=null;
    const done=v=>{ if(remotePending[seat]&&remotePending[seat].res===done) delete remotePending[seat];
      state.awaitSeat=-1; state.awaitKind=null;
      if(timer) clearTimeout(timer); res(v); };
    timer=setTimeout(()=>done(def), NET.T.act);
    remotePending[seat]={kind,res:done,valid,def,timer};
  });
}
function remoteActFrom(seat, kind, val){
  const rp=remotePending[seat];
  if(!rp || rp.kind!==kind) return;
  // 'swap' : le client renvoie un siège dans SON repère tourné → reconvertir en siège absolu
  if(kind==='swap' && typeof val==='number'){ val=(seat + val) % 4; }
  if(rp.valid && !rp.valid(val)) return;
  rp.res(val);
}
function seatToAI(seat){
  if(seatCtl[seat].kind!=='remote') return;
  const nm=NAMES[seat];
  seatCtl[seat]={kind:'ai'};
  NET.players=NET.players.filter(p=>p.seat!==seat);
  if(state && !state.over) toast(nm+' a quitté — une IA le remplace');
  const rp=remotePending[seat]; if(rp) rp.res(rp.def);
  netFlush();
}

/* ---------- matchmaking : recherche puis création automatique ---------- */
function mmStart(intent){
  if(!PeerCtor){ NET.screen='error'; NET.errMsg='PeerJS indisponible (vérifiez votre connexion internet).'; return; }
  NET.intent = (intent==='create') ? 'create' : 'search';
  NET.screen='pseudo';
  if(domIn.name){ domIn.name.value=myName; setTimeout(()=>{ try{ domIn.name.focus(); domIn.name.select&&domIn.name.select(); }catch(e){} }, 60); }
}
function netGoSearch(){
  if(NET.screen!=='pseudo') return;
  let v = domIn.name ? String(domIn.name.value||'').trim() : '';
  v = v.replace(/\s+/g,' ').slice(0,14);
  if(v){ myName=v; saveName(v); }
  mmRelaunch(NET.intent);
}
// (re)lance la recherche rapide ou la création directe, selon l'intention choisie au menu / à l'écran d'erreur
function mmRelaunch(intent){
  if(!PeerCtor){ NET.screen='error'; NET.errMsg='PeerJS indisponible (vérifiez votre connexion internet).'; return; }
  NET.intent = (intent==='create') ? 'create' : 'search';
  NET.role='off'; NET.screen='searching';
  if(NET.intent==='create'){ NET.status='Création d\'une partie…'; mmHostSlot(1); }
  else { NET.status='Recherche d\'une partie…'; mmScan(1, null, 0); }
}
function mmScan(slot, firstEmpty, cycle){
  if(NET.screen!=='searching') return;
  if(slot>MM_SLOTS){
    if(firstEmpty!=null) return mmHost(firstEmpty, cycle);
    NET.screen='error'; NET.errMsg='Toutes les tables sont pleines. Réessayez dans un instant.'; return;
  }
  NET.status='Recherche d\'une partie… (table '+slot+'/'+MM_SLOTS+')';
  const peer=new PeerCtor(undefined,{debug:0});
  let settled=false;
  const giveup=(empty)=>{ if(settled) return; settled=true; try{peer.destroy();}catch(e){}
    mmScan(slot+1, firstEmpty!=null?firstEmpty:(empty?slot:null), cycle); };
  const to=setTimeout(()=>giveup(true), NET.T.scan);
  peer.on('error', err=>{ if(err && err.type==='peer-unavailable'){ clearTimeout(to); giveup(true); }
    else if(err && (err.type==='network'||err.type==='server-error')){ clearTimeout(to); settled=true; try{peer.destroy();}catch(e){} NET.screen='error'; NET.errMsg='Serveur PeerJS injoignable.'; } });
  peer.on('open', ()=>{
    if(NET.screen!=='searching'){ try{peer.destroy();}catch(e){} return; }
    const conn=peer.connect(MM_PREFIX+slot, {reliable:true, metadata:{proto:PROTO}});
    conn.on('open', ()=>{ conn.send({t:'hello', name:myName, proto:PROTO}); });
    conn.on('data', msg=>{
      if(settled) return;
      if(msg && msg.t==='lobby'){ settled=true; clearTimeout(to); clientAdopt(peer, conn, msg); }
      else if(msg && msg.t==='deny'){ settled=true; clearTimeout(to); try{peer.destroy();}catch(e){} mmScan(slot+1, firstEmpty, cycle); }
    });
    conn.on('close', ()=>giveup(false));
  });
}
function becomeHost(peer){                                   // installe l'état d'hôte + ouvre le salon
  NET.role='host'; NET.peer=peer; NET.matchStarted=false;
  NET.players=[{seat:0, name:myName, conn:null}];
  NAMES[0]=myName;
  NET.screen='lobby'; NET.status='';
  lobbyBroadcast();
  peer.on('connection', hostOnConnection);
  peer.on('disconnected', ()=>{ try{peer.reconnect();}catch(e){} });
  startHb();
}
function mmHost(slot, cycle){
  NET.status='Création de la table '+slot+'…';
  const peer=new PeerCtor(MM_PREFIX+slot,{debug:0});
  let ok=false;
  peer.on('error', err=>{
    if(ok) return;
    if(err && err.type==='unavailable-id'){                 // quelqu'un vient de la prendre → on re-scanne
      try{peer.destroy();}catch(e){}
      if(cycle<2 && NET.screen==='searching') mmScan(1, null, cycle+1);
      else if(NET.screen==='searching'){ NET.screen='error'; NET.errMsg='Impossible de rejoindre ou de créer une table. Réessayez.'; }
    } else if(NET.screen==='searching'){ NET.screen='error'; NET.errMsg='Serveur PeerJS injoignable.'; }
  });
  peer.on('open', ()=>{
    if(NET.screen!=='searching'){ try{peer.destroy();}catch(e){} return; }
    ok=true; becomeHost(peer);
  });
  peer.on('disconnected', ()=>{ try{peer.reconnect();}catch(e){} });
}
/* ---------- création directe : on héberge sans passer par la recherche (évite le blocage) ---------- */
function mmHostSlot(slot){                                   // tente d'héberger chaque créneau, prend le premier libre
  if(NET.screen!=='searching') return;
  if(slot>MM_SLOTS){ NET.screen='error'; NET.errMsg='Toutes les tables sont occupées pour le moment. Réessayez dans un instant.'; return; }
  NET.status='Création d\'une partie… (table '+slot+'/'+MM_SLOTS+')';
  const peer=new PeerCtor(MM_PREFIX+slot,{debug:0});
  let done=false;
  peer.on('error', err=>{
    if(done) return;
    if(err && err.type==='unavailable-id'){ done=true; try{peer.destroy();}catch(e){} mmHostSlot(slot+1); }
    else if(NET.screen==='searching'){ done=true; NET.screen='error'; NET.errMsg='Serveur PeerJS injoignable.'; }
  });
  peer.on('open', ()=>{
    if(NET.screen!=='searching'){ try{peer.destroy();}catch(e){} return; }
    done=true; becomeHost(peer);
  });
}
function hostOnConnection(conn){
  conn.on('data', msg=>{
    if(!msg) return;
    if(msg.t==='hello'){
      if(msg.proto!==PROTO){ try{conn.send({t:'deny',reason:'version'});}catch(e){} setTimeout(()=>{try{conn.close();}catch(e){}},150); return; }
      if(NET.matchStarted){ try{conn.send({t:'deny',reason:'playing'});}catch(e){} setTimeout(()=>{try{conn.close();}catch(e){}},150); return; }
      if(NET.players.length>=4){ try{conn.send({t:'deny',reason:'full'});}catch(e){} setTimeout(()=>{try{conn.close();}catch(e){}},150); return; }
      let seat=1; while(NET.players.some(p=>p.seat===seat)) seat++;
      const name=String(msg.name||'Joueur').slice(0,16);
      NET.players.push({seat, name, conn});
      conn._seat=seat; conn._alive=performance.now();
      NAMES[seat]=name;
      lobbyBroadcast();
      if(NET.players.length===4) setTimeout(()=>{ if(!NET.matchStarted && NET.players.length===4) hostStartMatch(); }, 700);
      return;
    }
    const seat=conn._seat; if(seat==null) return;
    conn._alive=performance.now();
    if(msg.t==='hb') return;
    if(msg.t==='act'){ remoteActFrom(seat, msg.kind, msg.val); return; }
    if(msg.t==='uno'){ if(state && !state.over && state.current===seat && !state.saidUno[seat]){ state.saidUno[seat]=true; Sound.uno(); toast(NAMES[seat]+' annonce UNO !'); netFlush(); } return; }
    if(msg.t==='accuse'){
      if(state && state.vuln && state.vuln.player!==seat){
        if(state.vuln.phase==='open') resolveVuln(true, seat);
        else { try{conn.send({t:'tooLate'});}catch(e){} }
      }
      return;
    }
    if(msg.t==='chat'){ hostChat(NAMES[seat]||('Joueur '+seat), msg.text); return; }
    if(msg.t==='bye'){ try{conn.close();}catch(e){} return; }
  });
  conn.on('close', ()=>hostDropConn(conn));
  conn.on('error', ()=>hostDropConn(conn));
}
function hostDropConn(conn){
  const seat=conn._seat; if(seat==null) return; conn._seat=null;
  if(NET.matchStarted) seatToAI(seat);
  else { NET.players=NET.players.filter(p=>p.conn!==conn); lobbyBroadcast(); }
}
// Objectifs réglables via la barre du salon : « 1 manche » puis 100 → 1000 par pas de 50
const LOBBY_TARGETS = (function(){ const a=['round']; for(let v=100; v<=1000; v+=50) a.push(v); return a; })();
function targetLabel(t){ return t==='round' ? '1 manche' : (t+' pts'); }
function setSliderFromX(x){

  const val=LOBBY_TARGETS[Math.round(frac*(LOBBY_TARGETS.length-1))];

  if(val!==settings.target){ settings.target=val; lobbyBroadcast(); }
}
function lobbyRules(){ return {stacking:settings.stacking, mix:settings.mix, target:settings.target, nomercy:!!settings.nomercy}; }
function lobbyBroadcast(){
  const list=NET.players.map(p=>({seat:p.seat,name:p.name}));
  for(const p of NET.players){ if(!p.conn) continue;
    try{ p.conn.send({t:'lobby', you:p.seat, players:list, rules:lobbyRules()}); }catch(e){}
  }

}
function hostStartMatch(){
  if(NET.role!=='host' || NET.matchStarted || NET.players.length<2) return;
  NET.matchStarted=true; NET.screen=null;
  const used=NET.players.map(p=>p.name);
  let ai=AI_POOL.filter(n=>!used.includes(n));

    else { seatCtl[s]={kind:'ai'}; NAMES[s]=ai.shift()||('Bot-'+s); }
  }

/* ---------- côté client : actions optimistes (le clic anime tout de suite, l'hôte confirme) ---------- */
function predictPlay(idx){
  const card=hands[0][idx]; if(!card) return;
  card._rot=(Math.random()*8-4)*Math.PI/180;
  if(card.type==='wild'||card.type==='wild4') NET.pred.wildId=card.id;
  const d=cardPos[card.id]; const src = d?{cx:d.x,cy:d.y,w:d.w,rot:d.rot}:seatTarget(0);
  const i=hands[0].indexOf(card); if(i>=0) hands[0].splice(i,1);        // retire de la main IMMÉDIATEMENT (fluide)
  NET.pred.plays[card.id]={ t:performance.now(), card };
  Sound[(card.color==='wild'||card.type!=='number')?'special':'play']();
  animate({ type:'card', faceDown:false, key:spriteKey(card), toTop:true,   // vol optimiste vers la défausse dès le clic
    cx0:src.cx, cy0:src.cy, cx1:L.discard.x+L.discard.w/2, cy1:L.discard.y+L.discard.h/2,
    w0:src.w||L.cw, w1:L.cw, r0:src.rot||0, r1:card._rot, dur:260,
    onEnd:()=>{ if(!discard.find(dd=>dd.id===card.id)) discard.push(card); } });
}
function predictDraw(){
  NET.pred.draw++;
  if(state.drawCountView!=null && state.drawCountView>0) state.drawCountView--;
  Sound.draw();
  const tgt=seatTarget(0);
  animate({ type:'card', faceDown:true, key:'back',
    cx0:L.draw.x+L.draw.w/2, cy0:L.draw.y+L.draw.h/2, cx1:tgt.cx, cy1:tgt.cy,
    w0:L.cw, w1:tgt.w, r0:0, r1:0, dur:230 });
  NET.pred.drawSched={ t0:performance.now(), stag:0, dur:230 };   // chaque vraie carte se pose à l'atterrissage de SON dos
}
function predictDrawPile(n){                                 // encaisse une pile de + : vol immédiat côté client (simultané avec l'hôte)
  NET.pred.draw++;                                           // un seul événement 'draw' (avec n cartes) sera consommé
  state.pendingDraw=0; state.pendingKind=null; state.pendingUnit=0;   // pile encaissée (optimiste)
  const tgt=seatTarget(0), dur=(n>2?150:230), stag=Math.min(dur, 150);
  for(let k=0;k<n;k++){
    setTimeout(()=>{ if(!state) return;
      Sound.draw();
      animate({ type:'card', faceDown:true, key:'back',
        cx0:L.draw.x+L.draw.w/2, cy0:L.draw.y+L.draw.h/2, cx1:tgt.cx, cy1:tgt.cy,
        w0:L.cw, w1:tgt.w, r0:0, r1:0, dur });
    }, k*stag);
  }
  NET.pred.drawSched={ t0:performance.now(), stag, dur };    // chaque carte se pose à l'atterrissage de son dos → une par une, en direct
}
function predictRecolor(color){
  const id=NET.pred.wildId; if(!id) return;
  const pr=NET.pred.plays[id]; const c=pr?pr.card:discard.find(d=>d.id===id);
  if(c){ c.chosenColor=color; delete c.__key; }            // la variante colorée s'affiche immédiatement
  state.currentColor=color;
  NET.pred.wildId=null;
}
function netPredict(kind, val){
  try{
    if(kind==='turn'){
      if(val && val.type==='play') predictPlay(val.idx);
      else if(val && val.type==='draw'){ if(state.pendingDraw>0) predictDrawPile(state.pendingDraw); else predictDraw(); }
    } else if(kind==='drewPlayable' && val && val.type==='play') predictPlay(val.idx);
    else if(kind==='color'){ predictRecolor(val); if(state) state.phase='resolving'; }   // referme le sélecteur de couleur tout de suite
    else if(kind==='challenge'){ if(state){ state.chal=null; state.phase='resolving'; } }   // referme le panneau de contestation tout de suite
  }catch(e){}
}

/* ---------- côté client ---------- */
function clientAdopt(peer, conn, lobbyMsg){
  NET.role='client'; NET.peer=peer; NET.conn=conn; NET.screen='lobby';
  NET.lobby={you:lobbyMsg.you, players:lobbyMsg.players, rules:lobbyMsg.rules};
  NET.lastSeen=performance.now();
  conn.on('data', clientOnData);
  conn.on('close', clientLost);
  conn.on('error', clientLost);
  startHb();
}
function clientOnData(msg){
  NET.lastSeen=performance.now();
  if(!msg) return;
  if(msg.t==='hb') return;
  if(msg.t==='lobby'){ NET.lobby={you:msg.you, players:msg.players, rules:msg.rules}; return; }
  if(msg.t==='chatMsg'){ chatPush(String(msg.from||'?').slice(0,16), String(msg.text||'').slice(0,120)); return; }
  if(msg.t==='tooLate'){ centerMessage("Vous n'avez pas protesté le UNO de ce joueur à temps.\nIl n'est pas pénalisé.", THEME.bad); return; }
  if(msg.t==='bye' || msg.t==='deny'){ clientLost(); return; }
  if(msg.t==='q'){ NET.q.push(msg); pumpQ(); return; }
}
async function pumpQ(){
  if(NET.busy) return; NET.busy=true;
  while(NET.q.length){
    const msg=NET.q.shift();
    try{
      if(msg.evs) for(const ev of msg.evs) await handleNetEv(ev);
      if(msg.view && state) applyView(msg.view);
    }catch(err){}
  }
  NET.busy=false;
}
async function handleNetEv(ev){
  switch(ev.ev){
    case 'roundStart': await clientRoundStart(ev); break;
    case 'toast': toastState={msg:ev.msg, t:performance.now()}; live.textContent=ev.msg; break;
    case 'uno': Sound.uno(); break;
    case 'cmsg': if(state){ state.centerMsg={ text:ev.text, color:ev.color, t0:performance.now(), until:performance.now()+(ev.ms||2800) }; } break;
    case 'play': if(state) await clientPlay(ev.seat, unpackCard(ev.card)); break;
    case 'recolor': { const c=discard.find(d=>d.id===ev.card.id); if(c){ const u=unpackCard(ev.card); Object.assign(c,u); } break; }
    case 'draw': if(state) await clientDrawAnim(ev.seat, ev.n, ev.cards); break;
    case 'drawall': if(state) await clientFlyToDiscard(ev.seat, ev.cards, {below:true, faceUp:true, sound:'special'}); break;   // Défausse tout : vol carte par carte
    case 'mercy_dump': if(state) await clientFlyToDiscard(ev.seat, ev.cards, {below:true, faceUp:true, sound:'special', dur:200}); break;   // élimination : dump animé sous la carte du dessus
    case 'handspass': if(state) await clientPassHands(ev.dir, ev.myNewHand, ev.counts); break;   // 0 : toutes les mains tournent (animé)
    case 'swap': if(state) await clientSwap(ev.a, ev.b, ev.myNewHand, ev.counts); break;   // 7 : échange animé des deux mains
    case 'roulette_reveal': if(state) await clientRevealToHand(ev.seat, ev.cards, ev.color); break;   // Roulette : révélation face visible carte par carte
    case 'eliminated': if(state){ Sound.error(); if(state.eliminated) state.eliminated[ev.seat]=true; } break;
    case 'reveal': {
      if(!state) break;
      for(let k=1;k<4;k++) hands[k]=ev.hands[k].map(unpackCard);
      state.revealing=true; state.revealStart=prefersReduced?-1e9:performance.now();
      let mx=0; for(let k=1;k<4;k++) mx=Math.max(mx,hands[k].length);
      Sound.win();
      if(mx>0 && !prefersReduced){ await sleep((mx-1)*REVEAL_STAGGER+REVEAL_FLIP+320); }
      break; }
  }
}
