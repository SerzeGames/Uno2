/* ============================================================

const Sound = (()=>{
  let actx=null, muted=false;
  function ensure(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); }
  function blip(freq, dur, type, gain, slideTo){
    if(muted||!actx) return;
    const t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'triangle'; o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain||0.14, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.02);
  }
  const api = {
    unlock(){ ensure(); },
    toggle(){ muted=!muted; return muted; },
    get muted(){ return muted; },
    play(){ blip(430,0.10,'triangle',0.13,560); },
    deal(){ blip(360,0.055,'triangle',0.09,520); },
    draw(){ blip(300,0.09,'sine',0.10,250); },
    special(){ blip(520,0.10,'square',0.10,700); setTimeout(()=>blip(700,0.10,'square',0.09,900),70); },
    error(){ blip(180,0.14,'sawtooth',0.09,120); },
    uno(){ blip(660,0.12,'triangle',0.14,990); setTimeout(()=>blip(990,0.14,'triangle',0.13),110); },
    win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>blip(f,0.18,'triangle',0.14),i*110)); }
  };
  return api;
})();

const sleep = ms => new Promise(r=>setTimeout(r,ms));

const easeOut = t => 1-Math.pow(1-t,3);
const easeInOut = t => t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ============================================================
   Modèle cartes
   ============================================================ */
let CARD_ID = 1;
function mk(color,type,value){ return { id:CARD_ID++, color, type, value, chosenColor:null, _rot:0 }; }
function buildDeck(){
  const d=[];
  for(const c of COLORS){
    d.push(mk(c,'number',0));
    for(let v=1; v<=9; v++){ d.push(mk(c,'number',v)); d.push(mk(c,'number',v)); }
    for(const t of ['skip','reverse','draw2']){ d.push(mk(c,t,null)); d.push(mk(c,t,null)); }
  }
  for(let i=0;i<4;i++){ d.push(mk('wild','wild',null)); d.push(mk('wild','wild4',null)); }
  return shuffle(d);
}
// Paquet UNO No Mercy (approx. officiel, 4 joueurs) : cartes couleur + nouvelles + jokers spéciaux
function buildDeckNM(){
  const d=[];
  for(const c of COLORS){
    d.push(mk(c,'number',0));
    for(let v=1; v<=9; v++){ d.push(mk(c,'number',v)); d.push(mk(c,'number',v)); }
    for(const t of ['skip','reverse']){ d.push(mk(c,t,null)); d.push(mk(c,t,null)); }
    for(let k=0;k<3;k++){ d.push(mk(c,'draw2',null)); d.push(mk(c,'draw4',null)); }   // +2 et +4 colorés
    d.push(mk(c,'skipall',null)); d.push(mk(c,'skipall',null));                       // Passe tout le monde
    d.push(mk(c,'drawall',null)); d.push(mk(c,'drawall',null));                       // Défausse tout
  }
  for(let i=0;i<8;i++){ d.push(mk('wild','wild',null)); }                              // Joker (roulette des couleurs)
  for(let i=0;i<4;i++){ d.push(mk('wild','wildrev4',null)); }                          // Joker Inversion +4
  for(let i=0;i<4;i++){ d.push(mk('wild','wild6',null)); }                             // Joker +6
  for(let i=0;i<4;i++){ d.push(mk('wild','wild10',null)); }                            // Joker +10
  return shuffle(d);
}
const DRAW_VALUE = { draw2:2, draw4:4, wildrev4:4, wild6:6, wild10:10 };               // valeur d'empilement des cartes "+X"
function drawValue(card){ return DRAW_VALUE[card.type] || 0; }
function spriteKey(card){
  if(card.__key) return card.__key;                 // carte reconstruite côté client (multijoueur)
  if(card.color==='wild'){
    if(card.type==='wildrev4') return 'wildrev4';
    if(card.type==='wild6') return 'wild6';
    if(card.type==='wild10') return 'wild10';
    const base = card.type==='wild4' ? 'wild4' : 'wild';
    if(card.chosenColor){ const k=base+'_'+card.chosenColor; if(curMap()[k]) return k; }   // variante colorée seulement si la planche en a une (absente en No Mercy → reste 'wild')
    return base;
  }
  if(card.type==='number') return card.color+'_'+card.value;
  return card.color+'_'+card.type;                  // skip/reverse/draw2/draw4/drawall/skipall
}
function cardPoints(c){ if(c.color==='wild') return 50; if(c.type!=='number') return 20; return c.value; }
function effColor(card){ return card.color==='wild' ? card.chosenColor : card.color; }
function isPlayable(card, top){
  if(card.color==='wild') return true;
  const ec = effColor(top);
  if(card.color===ec) return true;
  if(card.type==='number' && top.type==='number' && card.value===top.value) return true;
  if(card.type!=='number' && card.type===top.type) return true;
  return false;
}

/* ============================================================
   État
   ============================================================ */
let hands=[[],[],[],[]];
let drawPile=[], discard=[];
const scores=[0,0,0,0];
let state = null;
let settings = { stacking:false, mix:false, target:500, targetSet:false };   // objectif de points ('round'|200|500|1000) ; targetSet=false → défaut selon le mode (classique 500, No Mercy 1000)
let inMenu = false;                              // true = écran de création de partie
let rulesOverlay = false;                        // overlay règles (menu ou en jeu)
let runToken = 0;                                // invalide les boucles de jeu obsolètes
let skipDeal = false;                            // clic pendant la distribution = accélérer
function top(){ return discard[discard.length-1]; }
function canStack(card){
  if(!state || state.pendingDraw<=0) return false;
  if(state.nomercy){
    const dv=drawValue(card);                       // toute carte "+X" de valeur ≥ à l'unité en cours
    return dv>0 && dv>=(state.pendingUnit||2);
  }
  if(!state.stacking) return false;
  if(card.type==='draw2') return state.pendingKind==='draw2' || (state.pendingKind==='wild4' && state.mix);
  if(card.type==='wild4') return state.pendingKind==='wild4' || (state.pendingKind==='draw2' && state.mix);
  return false;
}
function isLegalPlay(card){
  if(state && state.pendingDraw>0) return canStack(card);   // en pleine pile : on ne peut qu'empiler
  return isPlayable(card, top());
}
// Le siège a-t-il un coup possible (jouer/empiler) ? sinon il devra piocher automatiquement
function seatHasMove(pi){ return state.pendingDraw>0 ? hands[pi].some(c=>canStack(c)) : hands[pi].some(c=>isPlayable(c, top())); }
function nextIdx(i){
  let j=(i + state.dir + 4) % 4;
  if(state.nomercy){ let guard=0; while(state.eliminated && state.eliminated[j] && guard++<4){ j=(j + state.dir + 4) % 4; } }
  return j;
}
// Mercy Rule : un joueur atteignant 25 cartes est éliminé ; dernier en jeu = vainqueur. Renvoie true si la partie se termine.
async function mercyCheck(){
  if(!state || !state.nomercy) return false;
  for(let k=0;k<4;k++){
    if(!state.eliminated[k] && hands[k].length>=25){
      toast(NAMES[k]+' atteint 25 cartes — ÉLIMINÉ !'); Sound.error();
      const toss=hands[k].slice();                            // toute sa main part à la défausse d'abord…
      netEmit({ev:'mercy_dump', seat:k, cards:toss.map(packCard)}); netFlushEventsOnly();   // le client anime le dump EN MÊME TEMPS
      await flyCardsToDiscard(k, toss, {below:true, sound:'special', dur:200});   // …sous la carte du dessus (60 fps)
      if(!state) return true;
      state.eliminated[k]=true; hands[k]=[];                  // …puis seulement il est déclaré éliminé
      netEmit({ev:'eliminated', seat:k});
    }
  }
  const alive=[0,1,2,3].filter(k=>!state.eliminated[k]);
  if(alive.length<=1){ await endGame(alive.length?alive[0]:state.current); return true; }
  return false;
}

/* ============================================================
   Layout
   ============================================================ */
const L = { buttons:{}, ui:{} };
function computeLayout(){
  const W=view.w, H=view.h, s=Math.min(W,H);
  const ch = clamp(Math.round(s*0.185), 84, 150);
  const cw = Math.round(ch*cardAR());
  const och = Math.round(ch*0.60), ocw=Math.round(och*cardAR());
  L.cw=cw; L.ch=ch; L.ocw=ocw; L.och=och; L.W=W; L.H=H;

  const cx=Math.round(W/2), cy=Math.round(H/2 - ch*0.04);
  const gap=Math.round(cw*0.55);
  L.draw    = { x: cx-cw-Math.round(gap/2), y: cy-Math.round(ch/2), w:cw, h:ch };
  L.discard = { x: cx+Math.round(gap/2),    y: cy-Math.round(ch/2), w:cw, h:ch };
  L.center  = { x:cx, y:cy };

  L.handY = Math.round(H - ch - Math.max(14, H*0.02));
  L.hand  = { cx:Math.round(W/2), cy:Math.round(L.handY+ch/2) };

  // Chips avatars (dimensions)
  const chW=Math.round(clamp(W*0.20, 132, 190)), chH=40;

  const topY  = Math.round(Math.max(64, H*0.075) + och/2);
  const leftX = Math.round(Math.max(46, W*0.045) + ocw/2);
  const rightX= Math.round(W - Math.max(46, W*0.045) - ocw/2);

  // Colonnes latérales : éventail (empreinte 7 cartes) + avatar JUSTE au-dessus, l'unité centrée verticalement
  const refLen = 7*ocw*0.72;                                   // longueur éventail plein (7 cartes)
  const fanVisH = refLen + Math.round(och*0.54);               // hauteur visuelle de l'éventail plein
  const unitH = chH + 10 + fanVisH;                            // avatar + éventail
  const availTop = 60, availBot = L.handY - 12;
  const sideAvatarY = Math.max(availTop, Math.round((availTop + availBot - unitH)/2));
  const fanFirstTop = sideAvatarY + chH + 10;                  // haut de la 1re carte (éventail plein)
  const sideCY = Math.round(fanFirstTop + och/2 + refLen/2 - ocw*0.36); // centre de l'éventail
  const sideBudget = refLen;                                   // hauteur figée (compresse au-delà de 7)

  // Avatar "Vous" : centré horizontalement, juste au-dessus de la main (au-dessus de la zone de saisie des cartes)
  const meAvatarY = L.handY - chH - 32;

  L.seat = [
    { cx:L.hand.cx, cy:L.hand.cy, rot:0,          w:cw  },                    // 0 bas (interactif)
    { cx:leftX,     cy:sideCY,    rot:Math.PI/2,  w:ocw, budget:sideBudget }, // 1 gauche
    { cx:Math.round(W/2), cy:topY, rot:0,         w:ocw },                    // 2 haut
    { cx:rightX,    cy:sideCY,    rot:-Math.PI/2, w:ocw, budget:sideBudget }  // 3 droite
  ];

  L.avatar = [
    { x:Math.round(W/2-chW/2), y:meAvatarY, w:chW, h:chH, align:'center' },   // Vous : centré au-dessus de la main
    { x:16, y:sideAvatarY,   w:chW, h:chH, align:'left' },                    // gauche
    { x:Math.round(W/2-chW/2), y:12, w:chW, h:chH, align:'center' },          // haut
    { x:W-16-chW, y:sideAvatarY, w:chW, h:chH, align:'left' }                 // droite
  ];
  // repères pour les boutons du joueur (empilés et centrés au-dessus de l'avatar "Vous")
  L.me = { unoY: meAvatarY - 52, keepY: meAvatarY - 52 - 40 };

  // Anneau de sens : aussi grand que possible en dégageant bien les piles,
  // tout en restant sous l'éventail du haut et au-dessus du bouton UNO
  const clusterHalf = (L.discard.x + L.discard.w) - cx;        // demi-largeur des 2 piles
  const topGuard = topY + Math.round(och/2) + 10;              // sous les cartes du haut
  const botGuard = meAvatarY - 52 - 10;                        // au-dessus du bouton UNO
  const ry = Math.max(ch*0.62, Math.min(ch*1.02, cy - topGuard, botGuard - cy));
  const rx = Math.max(clusterHalf + cw*0.6, ry*1.12);          // large marge autour des piles
  L.ring = { rx: Math.round(rx), ry: Math.round(ry) };
}

/* ============================================================
   Rendu d'une carte (clip rounded + ombre + glow/dim)
   ============================================================ */
function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath(); c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
// Pré-rend chaque face de carte (coins arrondis + ombre cuite) → drawImage rapide, zéro shadowBlur par frame
function buildCardCache(){
  const SH=curSheet(), MAP=curMap();
  if(!SH) return;
  const dpr=view.dpr;
  cacheCoreW=Math.max(48, Math.round(L.cw));
  cacheCoreH=Math.round(L.ch);
  cachePad=Math.round(cacheCoreW*0.22);
  const devW=Math.round((cacheCoreW+2*cachePad)*dpr), devH=Math.round((cacheCoreH+2*cachePad)*dpr);
  cardCache={}; cacheMode = (state && state.nomercy) ? 'nm' : 'classic';
  for(const key in MAP){
    const cnv=document.createElement('canvas'); cnv.width=devW; cnv.height=devH;
    const c=cnv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
    const x=cachePad, y=cachePad, w=cacheCoreW, h=cacheCoreH, r=w*0.085;
    c.save(); c.shadowColor='rgba(0,0,0,0.5)'; c.shadowBlur=w*0.14; c.shadowOffsetY=h*0.05;
    c.fillStyle='#000'; rr(c,x,y,w,h,r); c.fill(); c.restore();
    c.save(); rr(c,x,y,w,h,r); c.clip();
    const b=MAP[key]; c.drawImage(SH, b[0],b[1],b[2],b[3], x,y,w,h); c.restore();
    cardCache[key]=cnv;
  }
}
function drawCard(key,x,y,w,h,rot,opt){
  opt=opt||{};
  const img=cardCache[key]||cardCache['back']; if(!img) return;
  const r=w*0.085;
  ctx.save();
  ctx.translate(x+w/2, y+h/2);
  if(rot) ctx.rotate(rot);
  const s=w/cacheCoreW, totW=(cacheCoreW+2*cachePad)*s, totH=(cacheCoreH+2*cachePad)*s;
  ctx.drawImage(img, -totW/2, -totH/2, totW, totH);
  if(opt.dim){ rr(ctx,-w/2,-h/2,w,h,r); ctx.fillStyle='rgba(10,6,16,'+opt.dim+')'; ctx.fill(); }
  if(opt.glow){ ctx.save(); ctx.shadowColor=opt.glow; ctx.shadowBlur=w*0.5; ctx.strokeStyle=opt.glow; ctx.lineWidth=Math.max(2.5,w*0.03); rr(ctx,-w/2,-h/2,w,h,r); ctx.stroke(); ctx.restore(); }
  ctx.restore();
}

/* ============================================================
   Layout d'une main (renvoie les centres) — sert au rendu ET aux animations
   ============================================================ */
function layoutHand(seat, count){
  const st=L.seat[seat]; const out=[];
  if(count<=0) return out;
  if(seat===0){
    const maxLen=Math.min(count*L.cw, L.W*0.94);
    const step = count>1 ? (maxLen-L.cw)/(count-1) : 0;
    const startX = st.cx - maxLen/2 + L.cw/2;
    for(let i=0;i<count;i++) out.push({ cx:startX+i*step, cy:st.cy, rot:0, w:L.cw });
  } else if(seat===2){
    const maxLen=Math.min(count*L.ocw*0.72, L.W*0.42);
    const step = count>1 ? (maxLen-L.ocw*0.72)/(count-1) : 0;
    const startX = st.cx - maxLen/2 + L.ocw*0.36;
    for(let i=0;i<count;i++) out.push({ cx:startX+i*step, cy:st.cy, rot:0, w:L.ocw });
  } else { // gauche / droite : colonne verticale, centrée entre l'avatar et la main
    const maxLen=Math.min(count*L.ocw*0.72, st.budget || L.H*0.42);
    const step = count>1 ? (maxLen-L.ocw*0.72)/(count-1) : 0;
    const startY = st.cy - maxLen/2 + L.ocw*0.36;
    for(let i=0;i<count;i++) out.push({ cx:st.cx, cy:startY+i*step, rot:st.rot, w:L.ocw });
  }
  return out;
}

/* ============================================================
   Animations (cartes volantes) + boucle de rendu
   ============================================================ */
let anims=[];
let cardPos={};            // id -> {x,y,w,rot} position AFFICHÉE (lissée) de chaque carte en main
let flyingIds={};          // ids des cartes en vol (0/7) : masquées de l'éventail tant qu'elles ne sont pas posées
let frameDt=16;            // delta-temps de la dernière frame (pour un lissage indépendant du framerate)
function animate(o){
  if(prefersReduced || !o.dur){ if(o.onEnd)o.onEnd(); return Promise.resolve(); }
  return new Promise(res=>{ o.t=0; o.p=0; o._res=res; anims.push(o); });
}
function discardDropCenter(){
  const rot=(Math.random()*10-5)*Math.PI/180;
  return { cx:L.discard.x+L.discard.w/2, cy:L.discard.y+L.discard.h/2, rot };
}
function seatTarget(seat){
  const st=L.seat[seat];
  return { cx:st.cx, cy:st.cy, w:st.w, rot:st.rot };
}
// Rapproche en douceur la position affichée d'une carte de sa cible (glissement fluide de la main)
function easePos(id, tx, ty, tw, trot){
  let p=cardPos[id];
  if(!p) return (cardPos[id]={x:tx,y:ty,w:tw,rot:trot});
  const k=prefersReduced?1:(1-Math.exp(-frameDt/70));   // tau≈70ms → glissement souple ~0.25s
  p.x+=(tx-p.x)*k; p.y+=(ty-p.y)*k; p.w+=(tw-p.w)*k; p.rot+=(trot-p.rot)*k;
  if(Math.abs(tx-p.x)<0.4) p.x=tx;
  if(Math.abs(ty-p.y)<0.4) p.y=ty;
  return p;
}
async function animatePlay(seat, card, src){
  const tgt=discardDropCenter(); card._rot=tgt.rot;
  Sound[(card.color==='wild'||card.type!=='number')?'special':'play']();
  await animate({ type:'card', faceDown:false, key:spriteKey(card), toTop:true,
    cx0:src.cx, cy0:src.cy, cx1:tgt.cx, cy1:tgt.cy, w0:src.w, w1:L.cw,
    r0:src.rot||0, r1:tgt.rot, dur:260 });
}

let lastTS=0;
function frame(ts){
  if(!lastTS) lastTS=ts;
  let dt=ts-lastTS; lastTS=ts;
  if(dt>60) dt=60; if(dt<0) dt=16;                 // clamp (onglet inactif)
  frameDt=dt;
  for(let i=anims.length-1;i>=0;i--){
    const a=anims[i]; a.t+=dt; const p=Math.min(1,a.t/a.dur); a.p=easeOut(p);
    if(p>=1){ anims.splice(i,1); if(a.onEnd)a.onEnd(); a._res&&a._res(); }
  }
  if(state && state.swapFx){ for(const s of state.swapFx){ s.t+=dt; } }   // timers de l'échange (carte 7)
  draw();
  requestAnimationFrame(frame);
}

/* ============================================================
   Fond de table
   ============================================================ */
function renderBackgroundCache(){
  const W=view.w, H=view.h, dpr=view.dpr;
  if(!bgCanvas){ bgCanvas=document.createElement('canvas'); bgctx=bgCanvas.getContext('2d'); }
  bgCanvas.width=Math.round(W*dpr); bgCanvas.height=Math.round(H*dpr);
  const c=bgctx; c.setTransform(dpr,0,0,dpr,0,0);
  const g=c.createRadialGradient(W/2,H*0.42,60, W/2,H*0.5, Math.max(W,H)*0.75);
  g.addColorStop(0,THEME.feltA); g.addColorStop(1,THEME.feltB);
  c.fillStyle=g; c.fillRect(0,0,W,H);
  c.save(); c.translate(W/2,H*0.5); c.rotate(-0.32);
  c.strokeStyle='rgba(255,255,255,0.035)'; c.lineWidth=Math.max(10,W*0.012);
  c.beginPath(); c.ellipse(0,0, Math.min(W,H)*0.42, Math.min(W,H)*0.24, 0, 0, Math.PI*2); c.stroke();
  c.restore();
  const vg=c.createRadialGradient(W/2,H/2, Math.min(W,H)*0.3, W/2,H/2, Math.max(W,H)*0.7);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.35)');
  c.fillStyle=vg; c.fillRect(0,0,W,H);
}
function blitBackground(){ if(bgCanvas){ ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(bgCanvas,0,0); ctx.restore(); } }

/* ============================================================
   Piles centrales + couleur active + sens
   ============================================================ */
function drawPiles(){
  drawDirectionArrow();                 // anneau de sens DERRIÈRE les piles (piles/labels au-dessus)
  // pioche : petit talon
  const d=L.draw;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.45)'; ctx.shadowBlur=d.w*0.14; ctx.shadowOffsetY=d.h*0.04;
  ctx.fillStyle='#000'; roundRect(d.x-3,d.y-3,d.w,d.h,d.w*0.085); ctx.fill();
  ctx.restore();
  if(drawPile.length>1) drawCard('back', d.x-2, d.y-2, d.w, d.h, 0, {shadow:false});
  drawCard('back', d.x, d.y, d.w, d.h, 0);
  // compteur pioche
  labelPill(d.x+d.w/2, d.y+d.h+14, ((state&&state.drawCountView!=null)?state.drawCountView:drawPile.length)+' cartes', 'rgba(0,0,0,0.4)', THEME.sub);

  // aura couleur active autour de la défausse
  if(state && state.currentColor){
    const c=L.discard, col=COLOR_HEX[state.currentColor];
    ctx.save(); ctx.shadowColor=col; ctx.shadowBlur=c.w*0.55; ctx.strokeStyle=col; ctx.lineWidth=4;
    roundRect(c.x-6,c.y-6,c.w+12,c.h+12, (c.w+12)*0.085); ctx.stroke(); ctx.restore();
  }
  // défausse : quelques cartes en dessous + la carte du dessus
  const shown=discard.slice(-4);
  for(let i=0;i<shown.length;i++){
    const c=shown[i]; const isTop=(i===shown.length-1);
    const jitter=isTop?0:((i*7-10));
    drawCard(spriteKey(c), L.discard.x+jitter*0.4, L.discard.y+jitter*0.2, L.discard.w, L.discard.h, c._rot||0, {shadow:isTop});
  }
}
function drawDirectionArrow(){
  if(!state || state.dealing || state.over || state.revealing) return;
  const cx=L.center.x, cy=L.center.y;
  const rx=L.ring.rx, ry=L.ring.ry;                     // ellipse dégageant bien les piles
  const dir=state.dir;                                   // +1 horaire (0→1→2→3), -1 antihoraire
  const t=performance.now();
  const spin=(t*0.0011)*dir;                             // rotation continue DANS le sens du jeu
  const pulse=0.5+0.5*Math.sin(t*0.004);
  const cols=[THEME.red, THEME.yellow, THEME.green, THEME.blue];
  const lw=Math.max(5, L.cw*0.08);

  ctx.save();
  ctx.lineCap='round';
  // anneau arc-en-ciel segmenté (4 couleurs UNO) qui tourne, avec halo pulsant
  const seg=Math.PI/2;
  for(let k=0;k<4;k++){
    ctx.beginPath();
    ctx.strokeStyle=cols[k]; ctx.lineWidth=lw; ctx.globalAlpha=0.92;
    ctx.shadowColor=cols[k]; ctx.shadowBlur=lw*(1.7+0.9*pulse);
    ctx.ellipse(cx,cy,rx,ry, 0, spin+k*seg+0.10, spin+(k+1)*seg-0.10, false);
    ctx.stroke();
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;

  // chevrons blancs qui orbitent dans le sens du jeu (indiquent clairement la direction)
  const n=3, s=Math.max(8, L.cw*0.14);
  for(let i=0;i<n;i++){
    const a=spin + i*(2*Math.PI/n);
    const px=cx+rx*Math.cos(a), py=cy+ry*Math.sin(a);
    const dx=dir*(-rx*Math.sin(a)), dy=dir*(ry*Math.cos(a));   // vecteur de déplacement (tangente à l'ellipse)
    ctx.save();
    ctx.translate(px,py); ctx.rotate(Math.atan2(dy,dx));
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle='rgba(18,10,24,0.9)'; ctx.lineWidth=lw*1.1+3;      // contour sombre (lisible sur toute couleur)
    ctx.beginPath(); ctx.moveTo(-s*0.55,-s); ctx.lineTo(s*0.72,0); ctx.lineTo(-s*0.55,s); ctx.stroke();
    ctx.strokeStyle='#fff'; ctx.lineWidth=lw*0.85;
    ctx.shadowColor='rgba(255,255,255,0.95)'; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.moveTo(-s*0.55,-s); ctx.lineTo(s*0.72,0); ctx.lineTo(-s*0.55,s); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

/* ============================================================
   Mains
   ============================================================ */
function drawHands(){
  const live={};
  for(let seat=0; seat<4; seat++){
    const total=hands[seat].length;
    const count = state.dealing ? Math.min(state.revealed[seat]|0, total) : total;
    const rects=layoutHand(seat,total);
    if(seat===0){
      // marque toutes les cartes "live" (y compris en vol), puis rend en 2 passes :
      // NON jouables d'abord, JOUABLES au-dessus, survolée tout au-dessus → jouables jamais cachées
      const pf=[];
      for(let i=0;i<count;i++){ const c=hands[seat][i]; live[c.id]=1; pf[i]= !state.dealing && humanCanPlay(c); }
      const drawSeat0=(i)=>{
        const c=hands[seat][i], r=rects[i];
        if(flyingIds[c.id]) return;                          // en vol (0/7) : dessinée par l'animation
        if(state.dealing){ const pp=easePos(c.id, r.cx, r.cy, L.cw, 0); drawCard(spriteKey(c), pp.x-L.cw/2, pp.y-L.ch/2, L.cw, L.ch, pp.rot, {}); return; }
        const playable=pf[i], hovered=(state.hoverIdx===i && playable);
        let lift = playable ? -7 : 0; if(hovered) lift=-24;
        const glow = playable ? (c.color==='wild'?THEME.wild:COLOR_HEX[c.color]) : null;
        const pp=easePos(c.id, r.cx, r.cy+lift, L.cw, 0);
        drawCard(spriteKey(c), pp.x-L.cw/2, pp.y-L.ch/2, L.cw, L.ch, pp.rot, { glow, dim: playable?0:0.5 });
      };
      if(state.dealing){ for(let i=0;i<count;i++) drawSeat0(i); }
      else {
        for(let i=0;i<count;i++){ if(!pf[i]) drawSeat0(i); }                       // non jouables (dessous)
        for(let i=0;i<count;i++){ if(pf[i] && i!==state.hoverIdx) drawSeat0(i); }   // jouables (au-dessus)
        if(state.hoverIdx>=0 && state.hoverIdx<count && pf[state.hoverIdx]) drawSeat0(state.hoverIdx);
      }
    } else {
      const w=rects.length?rects[0].w:L.ocw, h=w/cardAR();
      for(let i=0;i<count;i++){ const c=hands[seat][i], r=rects[i]; live[c.id]=1;
        if(flyingIds[c.id]) continue;                        // en vol (0/7) : dessinée par l'animation, pas dans l'éventail
        const pp=easePos(c.id, r.cx, r.cy, w, r.rot);
        if(state.revealing){
          const p=clamp((performance.now()-state.revealStart - i*REVEAL_STAGGER)/REVEAL_FLIP, 0, 1);
          const ww=Math.max(1, w*Math.abs(Math.cos(p*Math.PI)));           // flip autour de l'axe vertical
          drawCard(p<0.5?'back':spriteKey(c), pp.x-ww/2, pp.y-h/2, ww, h, pp.rot, {});
        } else {
          drawCard('back', pp.x-w/2, pp.y-h/2, w, h, pp.rot, {});
        }
      }
    }
  }
  for(const id in cardPos){ if(!live[id]) delete cardPos[id]; }   // purge des cartes jouées
}

/* ============================================================
   Avatars + anneau de tour + score
   ============================================================ */
function pill(x,y,w,h,fill,stroke){ roundRect(x,y,w,h,h/2); ctx.fillStyle=fill; ctx.fill(); if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1.5; ctx.stroke(); } }
function labelPill(cx,cy,text,fill,color){
  ctx.font="600 13px 'Space Grotesk',sans-serif"; const w=ctx.measureText(text).width+18;
  pill(cx-w/2, cy-11, w, 22, fill||'rgba(0,0,0,0.4)'); ctx.fillStyle=color||THEME.sub;
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(text, cx, cy+1);
}
function drawAvatars(){
  for(let i=0;i<4;i++){
    const a=L.avatar[i], elim=(state.nomercy && state.eliminated[i]);
    const active=(state.current===i && !state.over && !state.dealing && !elim);
    if(elim){ ctx.save(); ctx.globalAlpha=0.4; }
    // anneau de tour (roue conique façon Wild)
    if(active){
      ctx.save();
      const cxr=a.x+a.h/2, cyr=a.y+a.h/2;
      const t=performance.now()/900;
      for(let k=0;k<4;k++){
        ctx.beginPath(); ctx.arc(cxr, cyr, a.h/2+7, t+k*Math.PI/2, t+k*Math.PI/2+Math.PI/2);
        ctx.strokeStyle=[THEME.red,THEME.yellow,THEME.green,THEME.blue][k]; ctx.lineWidth=4; ctx.stroke();
      }
      ctx.restore();
      ctx.save(); ctx.shadowColor=SEAT_ACCENT[i]; ctx.shadowBlur=18; pill(a.x,a.y,a.w,a.h,'rgba(30,20,42,0.95)',SEAT_ACCENT[i]); ctx.restore();
    } else {
      pill(a.x,a.y,a.w,a.h,'rgba(24,17,34,0.82)','rgba(255,255,255,0.10)');
    }
    // pastille couleur
    ctx.beginPath(); ctx.arc(a.x+a.h/2, a.y+a.h/2, a.h*0.28, 0, Math.PI*2); ctx.fillStyle=SEAT_ACCENT[i]; ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.font="700 13px 'Fredoka',sans-serif"; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(i===0?'★':NAMES[i][0], a.x+a.h/2, a.y+a.h/2+1);
    // nom + nb cartes
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillStyle=THEME.text; ctx.font="600 14px 'Space Grotesk',sans-serif";
    ctx.fillText(NAMES[i], a.x+a.h+6, a.y+a.h*0.36);
    ctx.fillStyle=THEME.sub; ctx.font="500 11px 'Space Grotesk',sans-serif";
    const nc = state.dealing ? (state.revealed[i]|0) : hands[i].length;
    if(state.nomercy){ ctx.fillText(elim ? 'éliminé' : (nc+' carte'+(nc>1?'s':'')), a.x+a.h+6, a.y+a.h*0.70); }
    else ctx.fillText(nc+' carte'+(nc>1?'s':'')+'   •   '+scores[i]+' pts', a.x+a.h+6, a.y+a.h*0.70);

    // badge UNO (rouge "UNO?" si le joueur a oublié et est contestable)
    if(hands[i].length===1 && !elim){
      const vuln = state.vuln && state.vuln.player===i && state.vuln.phase==='open';
      const bx=a.x+a.w-4, by=a.y-6, col=vuln?THEME.bad:THEME.gold;
      ctx.save(); ctx.shadowColor=col; ctx.shadowBlur=12;
      roundRect(bx-40, by, 46, 20, 10); ctx.fillStyle=col; ctx.fill(); ctx.restore();
      ctx.fillStyle=vuln?'#fff':'#2a1e00'; ctx.font="700 12px 'Fredoka',sans-serif"; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(vuln?'UNO ?':'UNO', bx-17, by+11);
    }
    if(elim){ ctx.restore();   // ferme le globalAlpha
      ctx.save(); ctx.strokeStyle=THEME.bad; ctx.lineWidth=2.5; ctx.beginPath();
      ctx.moveTo(a.x+4,a.y+4); ctx.lineTo(a.x+a.w-4,a.y+a.h-4); ctx.moveTo(a.x+a.w-4,a.y+4); ctx.lineTo(a.x+4,a.y+a.h-4); ctx.stroke(); ctx.restore();
    }
  }
}

/* ============================================================
   Barre haute (titre + boutons)
   ============================================================ */
function button(name, x, y, w, h, label, opt){
  opt=opt||{};
  L.buttons[name]={x,y,w,h};
  ctx.save();
  if(opt.glow){ ctx.shadowColor=opt.glow; ctx.shadowBlur=opt.pulse? 12+8*Math.abs(Math.sin(performance.now()/300)) : 14; }
  roundRect(x,y,w,h,opt.round??h/2);
  ctx.fillStyle=opt.fill||'rgba(28,20,38,0.9)'; ctx.fill();
  ctx.restore();
  if(opt.stroke){ roundRect(x,y,w,h,opt.round??h/2); ctx.strokeStyle=opt.stroke; ctx.lineWidth=opt.lw||1.5; ctx.stroke(); }
  ctx.fillStyle=opt.color||THEME.text;
  ctx.font=opt.font||"600 14px 'Space Grotesk',sans-serif";
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(label, x+w/2, y+h/2+1);
}
function drawTopBar(){
  // wordmark UNO
  ctx.save(); ctx.translate(20,26);

function drawActionButtons(){
  // indice "piocher" quand c'est au joueur
  if(!state.over && state.current===0 && state.phase==='human'){
    const d=L.draw;
    if(state.pendingDraw>0){
      // face à une pile de + : piocher tout OU empiler
      const canS = hands[0].some(c=>canStack(c));
      ctx.save(); ctx.shadowColor=THEME.bad; ctx.shadowBlur=10+8*Math.abs(Math.sin(performance.now()/320));
      roundRect(d.x-4,d.y-4,d.w+8,d.h+8,d.w*0.09); ctx.strokeStyle=THEME.bad; ctx.lineWidth=3; ctx.stroke(); ctx.restore();
      labelPill(d.x+d.w/2, d.y-16, 'Piochez '+state.pendingDraw+(canS?'  ·  ou empilez un +':''), 'rgba(20,12,30,0.92)', THEME.bad);
      L.buttons['drawpile']={x:d.x-6,y:d.y-6,w:d.w+12,h:d.h+12};
    } else {
      const noPlay = !hands[0].some(c=>isPlayable(c, top()));
      if(noPlay){
        ctx.save(); ctx.shadowColor=THEME.gold; ctx.shadowBlur=10+8*Math.abs(Math.sin(performance.now()/320));
        roundRect(d.x-4,d.y-4,d.w+8,d.h+8,d.w*0.09); ctx.strokeStyle=THEME.gold; ctx.lineWidth=3; ctx.stroke(); ctx.restore();
        labelPill(d.x+d.w/2, d.y-16, 'Cliquez pour piocher', 'rgba(20,12,30,0.9)', THEME.gold);
      } else {
        labelPill(d.x+d.w/2, d.y-16, 'ou piochez', 'rgba(0,0,0,0.35)', THEME.sub);
      }
      L.buttons['drawpile']={x:d.x-6,y:d.y-6,w:d.w+12,h:d.h+12};
    }
  }
  // Bouton UNO : actif à chaque tour du joueur, centré au-dessus de la main
  if(!state.over && state.current===0 && (state.phase==='human'||state.phase==='drewPlayable')){
    const armed=state.saidUno[0];
    const bw=132, bh=44, x=Math.round(L.W/2-bw/2), y=L.me.unoY;
    if(armed) button('unoBtn', x,y,bw,bh, 'UNO ✓', {fill:THEME.gold, color:'#2a1e00', glow:THEME.gold, pulse:true, round:12, font:"700 20px 'Fredoka',sans-serif"});
    else       button('unoBtn', x,y,bw,bh, 'UNO', {fill:'rgba(28,20,38,0.9)', color:THEME.gold, stroke:THEME.gold, lw:2, round:12, font:"700 20px 'Fredoka',sans-serif"});
  }
  // après pioche : jouer la carte piochée ou la garder — centré au-dessus du bouton UNO
  if(!state.over && state.phase==='drewPlayable'){
    const bw=120, bh=34, x=Math.round(L.W/2-bw/2), y=L.me.keepY;
    button('keep', x, y, bw, bh, 'Garder', {stroke:'rgba(255,255,255,0.25)', round:10});
    labelPill(L.W/2, y-16, 'Jouez la carte surlignée ou gardez-la', 'rgba(20,12,30,0.92)', THEME.sub);
  }
  // Bouton "N'a pas dit UNO !" près d'une IA vulnérable (placé par siège pour ne pas couvrir ses cartes)
  if(state.vuln && state.vuln.player!==0 && !(state.nomercy && state.eliminated[0])){
    const vp=state.vuln.player, a=L.avatar[vp];
    const bw=176, bh=38;
    let x, y;
    if(vp===2){ x=a.x+a.w/2-bw/2; y=a.y+a.h+8; }        // haut : sous l'avatar
    else if(vp===1){ x=a.x; y=a.y-bh-6; }               // gauche : au-dessus de l'avatar
    else { x=a.x+a.w-bw; y=a.y-bh-6; }                  // droite : au-dessus de l'avatar
    x=clamp(x,8,L.W-bw-8); y=Math.max(6,y);
    if(state.vuln.phase==='open')
      button('accuse', x,y,bw,bh, "N'A PAS DIT UNO !", {fill:THEME.bad, color:'#fff', glow:THEME.bad, pulse:true, font:"700 12px 'Fredoka',sans-serif", round:12});
    else

  }
}

function wrapText(text,x,y,maxW,lh){
  const words=text.split(' '); let line=''; 
  for(const wd of words){
    const test=line?line+' '+wd:wd;
    if(ctx.measureText(test).width>maxW && line){ ctx.fillText(line,x,y); line=wd; y+=lh; }
    else line=test;
  }
  if(line){ ctx.fillText(line,x,y); y+=lh; }
  return y;
}
function drawGameOver(){
  dimScreen(0.66);
  const multi = NET.role!=='off';
  const chatH = multi ? Math.max(96, Math.min(170, L.H-24-380)) : 0;    // zone tchat (multijoueur)
  const p=panel(Math.min(multi?470:440, L.W-40), Math.min(356+chatH, L.H-24));
  const win=state.winner, youWin=(win===0), gw=state.gameWon;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle=youWin?THEME.gold:THEME.text; ctx.font="700 27px 'Fredoka',sans-serif";
  const title = gw ? (youWin?'🎉 Vous gagnez la partie !':(NAMES[win]+' remporte la partie'))
                   : (youWin?'Vous videz votre main !':(NAMES[win]+' termine la manche'));
  ctx.fillText(title, L.W/2, p.y+42);
  ctx.fillStyle=THEME.sub; ctx.font="500 13px 'Space Grotesk',sans-serif";
  ctx.fillText('Manche gagnée : +'+state.roundPoints+' pts pour '+(youWin?'vous':NAMES[win]), L.W/2, p.y+70);
  ctx.fillStyle=THEME.gold; ctx.font="600 12px 'Space Grotesk',sans-serif";
  let objLine = state.target==='round' ? 'Mode : 1 manche' : ('Objectif : '+state.target+' pts');
  if(state.elimBonus>0) objLine += '   ·   Mercy : +250 × '+state.elimCount;
  ctx.fillText(objLine, L.W/2, p.y+90);

  const order=[0,1,2,3].slice().sort((a,b)=>scores[b]-scores[a]);
  let ry=p.y+122; const rowH=30;
  for(const i of order){
    const isWin=(i===win);
    ctx.textAlign='left';
    ctx.beginPath(); ctx.arc(p.x+36, ry, 7, 0, Math.PI*2); ctx.fillStyle=SEAT_ACCENT[i]; ctx.fill();
    ctx.fillStyle=isWin?THEME.gold:THEME.text; ctx.font=(isWin?"700 ":"500 ")+"15px 'Space Grotesk',sans-serif";

    ctx.textAlign='right'; ctx.fillStyle=isWin?THEME.gold:THEME.text; ctx.font="700 16px 'Fredoka',sans-serif";
    ctx.fillText(scores[i]+' pts', p.x+p.w-36, ry+1);
    ry+=rowH;
  }

  // Tchat de fin de manche (multijoueur uniquement)
  if(multi){
    const cx0=p.x+20, cw0=p.w-40, cy0=ry+6, ch0=chatH;
    roundRect(cx0, cy0, cw0, ch0, 12); ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.fill();
    roundRect(cx0, cy0, cw0, ch0, 12); ctx.strokeStyle='rgba(255,255,255,0.10)'; ctx.lineWidth=1; ctx.stroke();
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillStyle=THEME.gold; ctx.font="700 11px 'Fredoka',sans-serif";
    ctx.fillText('TCHAT', cx0+12, cy0+14);
    const inH=32, msgBottom=cy0+ch0-inH-12;
    // derniers messages, alignés en bas
    const lineH=17, maxLines=Math.max(1, Math.floor((msgBottom-(cy0+26))/lineH)+1);
    const msgs=NET.chat.slice(-maxLines);
    let my0=msgBottom - (msgs.length-1)*lineH;
    ctx.font="500 12px 'Space Grotesk',sans-serif";
    for(const m of msgs){
      let t=m.from+' : '+m.text;
      while(ctx.measureText(t).width>cw0-24 && t.length>4) t=t.slice(0,-2);
      if(t.length<(m.from+' : '+m.text).length) t+='…';
      const nw=ctx.measureText(m.from+' : ').width;
      ctx.fillStyle=THEME.gold; ctx.fillText(m.from+' :', cx0+12, my0);
      ctx.fillStyle=THEME.text; ctx.fillText(t.slice((m.from+' : ').length), cx0+12+nw, my0);
      my0+=lineH;

    if(!msgs.length){ ctx.fillStyle=THEME.dim; ctx.fillText('Discutez entre les manches…', cx0+12, cy0+ch0/2); }
    chatRect={ x:cx0+8, y:cy0+ch0-inH-6, w:cw0-16, h:inH };
  }

  const bw2=(p.w-52)/2, by=p.y+p.h-62;
  if(NET.role==='client'){
    ctx.fillStyle=THEME.gold; ctx.font="600 13px 'Space Grotesk',sans-serif"; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(gw?'Partie terminée':'En attente de l\'hôte pour la manche suivante…', p.x+20+bw2/2, by+24);
  }
  else if(gw) button('replay', p.x+20, by, bw2, 48, 'Rejouer', {fill:THEME.gold, color:'#2a1e00', glow:THEME.gold, round:14, font:"700 17px 'Fredoka',sans-serif"});

}

/* ============================================================
   Rendu global
   ============================================================ */
function draw(){
  L.buttons={};
  if(SHEET && ((state&&state.nomercy)?'nm':'classic')!==cacheMode){ computeLayout(); buildCardCache(); }   // bascule de planche : layout + cache cohérents
  blitBackground();
  syncDomInputs();
  if(inMenu){ drawMenu(); if(NET.screen) drawNetScreen(); if(rulesOverlay) drawRules(); return; }
  if(!state){ return; }
  drawPiles();
  if(state.pendingDraw>0) drawStackBadge();
  drawHands();
  for(const a of anims){
    if(a.type!=='card') continue;
    const p=a.p||0, cx=lerp(a.cx0,a.cx1,p), cy=lerp(a.cy0,a.cy1,p);
    const w=lerp(a.w0,a.w1,p), h=w/cardAR(), rot=lerp(a.r0||0,a.r1||0,p);
    drawCard(a.faceDown?'back':a.key, cx-w/2, cy-h/2, w, h, rot, {shadow:true});
  }
  // La carte du dessus de la défausse reste visible AU-DESSUS des cartes en vol (elles se glissent en dessous),
  // sauf pendant qu'une carte est justement jouée sur la pile (elle doit atterrir par-dessus).
  if(discard.length && anims.length && !anims.some(a=>a.type==='card' && a.toTop)){
    const tc=discard[discard.length-1];
    drawCard(spriteKey(tc), L.discard.x, L.discard.y, L.discard.w, L.discard.h, tc._rot||0, {shadow:true});
  }
  drawSwapFx();
  drawAvatars();
  drawTopBar();
  drawActionButtons();
  drawToast();
  drawCenterMsg();
  if(state.phase==='chooseColor' || state.phase==='rouletteColor') drawColorPicker();
  if(state.phase==='chooseSwap') drawSwapPrompt();
  if(state.chal && state.phase==='challengePrompt') drawChallenge();
  if(state.over) drawGameOver();
  if(rulesOverlay) drawRules();
}
function drawSwapFx(){
  if(!state || !state.swapFx) return;
  for(const s of state.swapFx){
    if(s.t<=0) continue;                                    // pas encore lancée (décalage en cascade)
    const raw=Math.min(1, s.t/s.dur); const p=easeInOut(raw);
    const q=1-p;
    // Bézier quadratique : (1-p)²·A + 2(1-p)p·C + p²·B
    const x=q*q*s.ax + 2*q*p*s.cx + p*p*s.bx;
    const y=q*q*s.ay + 2*q*p*s.cy + p*p*s.by;
    const w=s.w, h=w/cardAR(), rot=lerp(s.r0, s.r1, p);
    // léger « pop » d'échelle au milieu du vol
    const scale=1 + 0.10*Math.sin(Math.PI*p);
    drawCard('back', x-w*scale/2, y-h*scale/2, w*scale, h*scale, rot, {shadow:true});
  }
}
function drawCenterMsg(){
  const m=state.centerMsg; if(!m) return;
  const age=performance.now()-(m.t0||(m.until-2800)); const left=m.until-performance.now();
  if(left<=0){ state.centerMsg=null; return; }
  const alpha = left<400 ? left/400 : (age<200?age/200:1);
  const lines=m.text.split('\n');
  const fs = clamp(Math.round(Math.min(L.W,L.H)*0.042), 13, 19);   // taille adaptée à l'écran (plus petit sur mobile)
  const lh = Math.round(fs*1.4);
  ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,alpha));
  ctx.font="700 "+fs+"px 'Fredoka',sans-serif"; ctx.textAlign='center'; ctx.textBaseline='middle';
  let maxW=0; for(const ln of lines) maxW=Math.max(maxW, ctx.measureText(ln).width);
  const pw=Math.min(L.W-24, maxW+Math.round(fs*2.4)), ph=lh*lines.length+Math.round(fs*1.1);
  const topY=(L.seat&&L.seat[2])?L.seat[2].cy:Math.round(L.H*0.1);   // placé dans la bande AU-DESSUS des piles → l'action centrale reste visible
  const bandTop=topY+L.och*0.5+10, bandBot=L.discard.y-10;
  const x=Math.round(L.W/2-pw/2);
  const y=clamp(Math.round((bandTop+bandBot)/2-ph/2), 8, Math.max(8, Math.round(bandBot-ph)));   // priorité : ne jamais déborder sur les piles
  ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=20; roundRect(x,y,pw,ph,13); ctx.fillStyle='rgba(20,10,14,0.94)'; ctx.fill(); ctx.shadowBlur=0;
  roundRect(x,y,pw,ph,13); ctx.strokeStyle=m.color; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle=m.color;
  let ty=y+Math.round(ph/2-((lines.length-1)*lh/2));
  for(const ln of lines){ ctx.fillText(ln, L.W/2, ty); ty+=lh; }
  ctx.restore();
}

/* ============================================================
   Entrées (souris / tactile / clavier)
   ============================================================ */
let pending=null;                 // { kind, res }
function waitInput(kind){ return new Promise(res=>{ pending={kind,res}; }); }
function resolvePending(val){ if(pending){ const r=pending.res; pending=null; r(val); } }

function hitBtn(name, x, y){ const b=L.buttons[name]; return b && x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h; }
function hitHumanCard(x,y){
  const count=hands[0].length; if(!count) return -1;
  const rects=layoutHand(0,count);
  const within=(i)=>{ const r=rects[i]; return x>=r.cx-L.cw/2 && x<=r.cx+L.cw/2 && y>=r.cy-L.ch/2-26 && y<=r.cy+L.ch/2; };
  // même ordre que le rendu (jouables au-dessus) : survolée > jouables (droite→gauche) > non jouables (droite→gauche)
  if(state.hoverIdx>=0 && state.hoverIdx<count && within(state.hoverIdx)) return state.hoverIdx;
  for(let i=count-1;i>=0;i--){ if(i!==state.hoverIdx && humanCanPlay(hands[0][i]) && within(i)) return i; }
  for(let i=count-1;i>=0;i--){ if(!humanCanPlay(hands[0][i]) && within(i)) return i; }
  return -1;
}
function pos(e){
  const t=e.touches? e.touches[0]||e.changedTouches[0] : e;
  return { x:t.clientX, y:t.clientY };
}
function onDown(e){
  Sound.unlock();
  const {x,y}=pos(e);
  if(e.cancelable) e.preventDefault();

  if(hitBtn('mute',x,y)){ Sound.toggle(); return; }
  if(rulesOverlay){ rulesOverlay=false; return; }              // un clic ferme les règles
  if(hitBtn('rules',x,y) || hitBtn('menu_rules',x,y)){ rulesOverlay=true; return; }
  if(state && state.dealing){ skipDeal=true; return; }         // accélère la distribution

  // MENU de création de partie (+ écrans réseau par-dessus)
  if(inMenu){
    if(NET.screen){
      if(hitBtn('net_cancel',x,y)){ NET.screen=null; stopNet(true); resetSeats(); return; }
      if(NET.screen==='pseudo' && hitBtn('net_go',x,y)){ netGoSearch(); return; }
      if(NET.screen==='error'){
        if(hitBtn('net_create',x,y)){ resetSeats(); mmRelaunch('create'); return; }
        if(hitBtn('net_retry',x,y)){ resetSeats(); mmRelaunch('search'); return; }
      }
      if(NET.screen==='lobby' && NET.role==='host'){
        if(hitBtn('rule_classic',x,y)){ settings.nomercy=false; settings.stacking=false; Sound.play(); lobbyBroadcast(); return; }
        if(hitBtn('rule_stack',x,y)){ settings.nomercy=false; settings.stacking=true; Sound.play(); lobbyBroadcast(); return; }
        if(hitBtn('rule_nomercy',x,y)){ settings.nomercy=true; settings.stacking=true; settings.target=1000; settings.targetSet=true; Sound.play(); lobbyBroadcast(); return; }
        if(!settings.nomercy && settings.stacking && hitBtn('rule_mix',x,y)){ settings.mix=!settings.mix; Sound.play(); lobbyBroadcast(); return; }
        if(hitBtn('rule_slider',x,y)){ dragSlider=true; Sound.play(); setSliderFromX(x); return; }
        if(hitBtn('net_start',x,y)){ if(NET.players.length>=2) hostStartMatch(); return; }
      }
      return;
    }
    if(hitBtn('opt_stack',x,y)){ settings.stacking=!settings.stacking; Sound.play(); return; }
    if(settings.stacking && hitBtn('opt_nomix',x,y)){ settings.mix=false; Sound.play(); return; }
    if(settings.stacking && hitBtn('opt_mix',x,y)){ settings.mix=true; Sound.play(); return; }
    for(let i=0;i<4;i++){ if(hitBtn('tgt_'+i,x,y)){ settings.target=L.buttons['tgt_'+i].val; settings.targetSet=true; Sound.play(); return; } }
    if(hitBtn('play',x,y)){ settings.nomercy=false; resetSeats(); startGame(false); return; }
    if(hitBtn('nm_play',x,y)){ settings.nomercy=true; resetSeats(); startGame(false); return; }
    if(hitBtn('mm_play',x,y)){ settings.nomercy=false; resetSeats(); mmStart(); return; }
    if(hitBtn('mm_create',x,y)){ settings.nomercy=false; resetSeats(); mmStart('create'); return; }
    return;
  }

  if(hitBtn('new',x,y)){                                       // retour au menu / quitter la session
    if(NET.role!=='off'){ NET.leave(); return; }
    runToken++; if(state&&state.vuln)clearVuln(); inMenu=true; pending=null; return;
  }

  // Fin de partie
  if(state && state.over){
    if(NET.role==='client'){ if(hitBtn('to_menu',x,y)) NET.leave(); return; }
    if(state.gameWon){ if(hitBtn('replay',x,y)) startGame(false); }
    else { if(hitBtn('next',x,y)) startGame(true); }
    if(hitBtn('to_menu',x,y)){
      if(NET.role!=='off'){ NET.leave(); return; }
      runToken++; if(state&&state.vuln)clearVuln(); inMenu=true; pending=null;
    }
    return;
  }

  // Contestation "N'a pas dit UNO !" (indépendant du pending)
  if(state && state.vuln && state.vuln.player!==0 && !(state.nomercy && state.eliminated[0]) && hitBtn('accuse',x,y)){
    if(NET.role==='client'){ NET.send({t:'accuse'}); return; }
    if(state.vuln.phase==='open') resolveVuln(true, 0);                 // à temps → +2
    else { centerMessage("Vous n'avez pas protesté le UNO de ce joueur à temps.\nIl n'est pas pénalisé.", THEME.bad); clearVuln(); }
    return;
  }
  // Bouton UNO (pré-annonce) : actif pendant le tour du joueur
  if(state && !state.over && state.current===0 && (state.phase==='human'||state.phase==='drewPlayable') && hitBtn('unoBtn',x,y)){
    if(!state.saidUno[0]){ state.saidUno[0]=true; Sound.uno(); toast('UNO annoncé !'); if(NET.role==='client') NET.send({t:'uno'}); }
    return;
  }

  if(!pending) return;
  const k=pending.kind;
  if(k==='color'){
    for(const c of COLORS){ if(hitBtn('col_'+c,x,y)){ resolvePending(c); return; } }
    return;
  }
  if(k==='swap'){
    for(const s of (state.swapOptions||[])){ if(hitBtn('swap_'+s,x,y)){ resolvePending(s); return; } }        // menu central cliquable
    for(const s of (state.swapOptions||[])){ const a=L.avatar[s]; if(a && x>=a.x-6 && x<=a.x+a.w+6 && y>=a.y-6 && y<=a.y+a.h+6){ resolvePending(s); return; } }   // clic sur l'avatar
    return;
  }
  if(k==='challenge'){
    if(hitBtn('chal_yes',x,y)){ resolvePending(true); return; }
    if(hitBtn('chal_no',x,y)){ resolvePending(false); return; }
    return;
  }
  if(k==='drewPlayable'){
    if(hitBtn('keep',x,y)){ resolvePending({type:'keep'}); return; }
    const idx=hitHumanCard(x,y);
    if(idx>=0 && hands[0][idx]===state.drewCard && humanCanPlay(hands[0][idx])){ resolvePending({type:'play', idx}); return; }
    return;
  }
  if(k==='turn'){
    if(hitBtn('drawpile',x,y)){ resolvePending({type:'draw'}); return; }
    const idx=hitHumanCard(x,y);
    if(idx>=0){
      if(humanCanPlay(hands[0][idx])) resolvePending({type:'play', idx});
      else Sound.error();
    }
    return;
  }
}
let dragSlider=false;
function onMove(e){
  const {x,y}=pos(e);
  if(dragSlider){ if(e.cancelable) e.preventDefault(); setSliderFromX(x); return; }
  if(inMenu){
    const over = hitBtn('play',x,y)||hitBtn('mm_play',x,y)||hitBtn('mm_create',x,y)||hitBtn('nm_play',x,y)||hitBtn('opt_stack',x,y)||hitBtn('menu_rules',x,y)||hitBtn('mute',x,y)||rulesOverlay
      || hitBtn('net_cancel',x,y)||hitBtn('net_start',x,y)||hitBtn('net_go',x,y)||hitBtn('net_create',x,y)||hitBtn('net_retry',x,y)
      || hitBtn('rule_classic',x,y)||hitBtn('rule_stack',x,y)||hitBtn('rule_nomercy',x,y)||hitBtn('rule_mix',x,y)||hitBtn('rule_slider',x,y)
      || (settings.stacking && (hitBtn('opt_nomix',x,y)||hitBtn('opt_mix',x,y)))
      || hitBtn('tgt_0',x,y)||hitBtn('tgt_1',x,y)||hitBtn('tgt_2',x,y)||hitBtn('tgt_3',x,y);
    cv.style.cursor = over?'pointer':'default'; return;
  }
  if(!state || state.current!==0){ if(state) state.hoverIdx=-1; cv.style.cursor=anyChromeHit(x,y)?'pointer':'default'; return; }
  const idx=hitHumanCard(x,y);
  state.hoverIdx = (idx>=0 && humanCanPlay(hands[0][idx])) ? idx : -1;
  let cursor='default';
  if(state.hoverIdx>=0) cursor='pointer';
  else if((state.phase==='human'&&hitBtn('drawpile',x,y)) || anyChromeHit(x,y)) cursor='pointer';
  cv.style.cursor=cursor;
}
function anyChromeHit(x,y){ return hitBtn('mute',x,y)||hitBtn('rules',x,y)||hitBtn('new',x,y)||hitBtn('unoBtn',x,y)||hitBtn('accuse',x,y)||hitBtn('keep',x,y)||hitBtn('replay',x,y)||hitBtn('next',x,y)||hitBtn('to_menu',x,y); }

cv.addEventListener('touchstart', onDown, {passive:false});
cv.addEventListener('touchmove', onMove, {passive:false});
function onUp(){ dragSlider=false; }
