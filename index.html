function packCard(c){ return { id:c.id, color:c.color, type:c.type, value:c.value, chosenColor:c.chosenColor||null, k:spriteKey(c), rot:c._rot||0 }; }
function unpackCard(p){ return { id:p.id, color:p.color, type:p.type, value:p.value, chosenColor:p.chosenColor, __key:p.k, _rot:p.rot||0 }; }
function rotSeat(real, viewer){ return ((real - viewer) % 4 + 4) % 4; }

/* ---------- côté hôte : événements + diffusion ---------- */
function netEmit(ev){ if(NET.role==='host') NET.rawEvs.push(ev); }
function buildViewFor(viewer){
  const v={ names:[], counts:[], scores:[], dealing:!!state.dealing, nomercy:!!state.nomercy, expansion:!!state.expansion,
    current:rotSeat(state.current,viewer), dir:state.dir, currentColor:state.currentColor,
    top4:discard.slice(-4).map(packCard), drawCount:drawPile.length,
    pendingDraw:state.pendingDraw, pendingKind:state.pendingKind, pendingUnit:state.pendingUnit||0,
    stacking:state.stacking, mix:state.mix, target:state.target,
    elim: state.eliminated ? [0,1,2,3].map(k=>state.eliminated[(viewer+k)%4]) : [false,false,false,false],
    tokens: state.tokens ? [0,1,2,3].map(k=>({face:state.tokens[(viewer+k)%4].face, used:state.tokens[(viewer+k)%4].used, armed:state.tokens[(viewer+k)%4].armed})) : null,
    myHand:hands[viewer].map(packCard), saidMe:!!state.saidUno[viewer],
    vuln: state.vuln?{player:rotSeat(state.vuln.player,viewer), phase:state.vuln.phase}:null,
    over:state.over, gameWon:state.gameWon, winner:state.winner>=0?rotSeat(state.winner,viewer):-1,
    roundPoints:state.roundPoints, elimBonus:state.elimBonus||0, elimCount:state.elimCount||0, revealing:!!state.revealing, await:null };
  for(let k=0;k<4;k++){ const r=(viewer+k)%4; v.names.push(NAMES[r]); v.counts.push(hands[r].length); v.scores.push(scores[r]); }
  if(state.awaitSeat===viewer && state.awaitKind){
    v.await={kind:state.awaitKind};
    if(state.awaitKind==='drewPlayable' && state.drewCard) v.await.drewId=state.drewCard.id;
    if(state.awaitKind==='challenge' && state.chal) v.await.chalBy=rotSeat(state.chal.by,viewer);
    if(state.awaitKind==='swap' && state.swapOptions) v.await.swap=state.swapOptions.map(s=>rotSeat(s,viewer));
    if(state.awaitKind==='color' && state.roulette) v.await.roulette=true;   // roulette : le suivant choisit (picker roulette)
  }
  return v;
}
function rotEvsFor(seat, evs){
  const revs=[];
  for(const ev of evs){
    if(ev.ev==='penalty') continue;                       // couvert par la vue
    if(ev.ev==='reveal'){ revs.push({ev:'reveal', hands:[0,1,2,3].map(k=>ev.hands[(seat+k)%4])}); continue; }
    if(ev.ev==='handspass'){ const e2=Object.assign({},ev); e2.myNewHand=hands[seat].map(packCard); e2.counts=[0,1,2,3].map(k=>hands[(seat+k)%4].length); revs.push(e2); continue; }   // 0 : ma nouvelle main + comptes tournés
    if(ev.ev==='swap'){ const e2=Object.assign({},ev); e2.a=rotSeat(ev.a,seat); e2.b=rotSeat(ev.b,seat); if(seat===ev.a||seat===ev.b) e2.myNewHand=hands[seat].map(packCard); e2.counts=[0,1,2,3].map(k=>hands[(seat+k)%4].length); revs.push(e2); continue; }   // 7 : nouvelle main pour les 2 concernés
    const e=Object.assign({}, ev);
    if('seat' in e) e.seat=rotSeat(ev.seat, seat);
    if('a' in e) e.a=rotSeat(ev.a, seat);                 // swap : deux sièges
    if('b' in e) e.b=rotSeat(ev.b, seat);
    if(ev.ev==='draw' && e.seat!==0) delete e.cards;      // cartes privées : seulement pour le piocheur
    revs.push(e);
  }
  return revs;
}
function netFlush(){
  if(NET.role!=='host' || !state) return;
  const evs=NET.rawEvs; NET.rawEvs=[];
  for(const pl of NET.players){
    if(!pl.conn) continue;                                 // hôte local
    try{ pl.conn.send({t:'q', evs:rotEvsFor(pl.seat, evs), view:buildViewFor(pl.seat)}); }catch(err){}
  }
}
// Envoie tout de suite les événements d'animation en attente SANS la vue (état diffusé en fin de tour) :
// permet aux clients d'animer EN MÊME TEMPS que l'hôte, pas après son animation.
function netFlushEventsOnly(){
  if(NET.role!=='host' || !state) return;
  const evs=NET.rawEvs; if(!evs.length) return; NET.rawEvs=[];
  for(const pl of NET.players){
    if(!pl.conn) continue;
    try{ pl.conn.send({t:'q', evs:rotEvsFor(pl.seat, evs), view:null}); }catch(err){}
  }
}
function netRoundStart(first){
  if(NET.role!=='host') return;
  for(const pl of NET.players){
    if(!pl.conn) continue;
    const names=[],counts=[],sc=[];
    for(let k=0;k<4;k++){ const r=(pl.seat+k)%4; names.push(NAMES[r]); counts.push(hands[r].length); sc.push(scores[r]); }
    try{ pl.conn.send({t:'q', evs:[{ev:'roundStart', names, counts, scores:sc, nomercy:!!state.nomercy, expansion:!!state.expansion,
      myHand:hands[pl.seat].map(packCard), first:packCard(first), drawCount:drawPile.length,
      stacking:state.stacking, mix:state.mix, target:state.target}], view:null}); }catch(err){}
  }
}

/* ---------- tchat de fin de manche (relayé par l'hôte, visible sur l'écran des scores) ---------- */
function chatPush(from, text){
  NET.chat.push({from, text});
  if(NET.chat.length>40) NET.chat.splice(0, NET.chat.length-40);
}
function hostChat(from, text){                             // hôte : valide, stocke, diffuse
  text=String(text||'').replace(/\s+/g,' ').trim().slice(0,120);
  if(!text) return;
  if(!state || !state.over) return;                        // uniquement pendant l'écran des scores (anti-triche)
  chatPush(from, text);
  for(const p of NET.players){ if(p.conn){ try{ p.conn.send({t:'chatMsg', from, text}); }catch(e){} } }
}
function chatSend(text){
  text=String(text||'').replace(/\s+/g,' ').trim().slice(0,120);
  if(!text || NET.role==='off' || !state || !state.over) return;
  if(NET.role==='host') hostChat(myName, text);
  else NET.send({t:'chat', text});
}

/* ---------- côté hôte : attente d'une action distante ---------- */
const remotePending={};                                     // seat -> {kind,res,valid,def,timer}
function waitRemote(seat, kind, valid, def){
  if(seatCtl[seat].kind!=='remote') return Promise.resolve(def);   // le siège vient d'être converti en IA (déconnexion)
  state.awaitSeat=seat; state.awaitKind=kind; netFlush();
  return new Promise(res=>{
    let timer=null;
    const done=v=>{ if(remotePending[seat]&&remotePending[seat].res===done) delete remotePending[seat];
      state.awaitSeat=-1; state.awaitKind=null;
      if(timer) clearTimeout(timer); res(v); };
    timer=setTimeout(()=>done(def), NET.T.act);
    remotePending[seat]={kind,res:done,valid,def,timer};
  });
}
function remoteActFrom(seat, kind, val){
  const rp=remotePending[seat];
  if(!rp || rp.kind!==kind) return;
  // 'swap' : le client renvoie un siège dans SON repère tourné → reconvertir en siège absolu
  if(kind==='swap' && typeof val==='number'){ val=(seat + val) % 4; }
  if(rp.valid && !rp.valid(val)) return;
  rp.res(val);
}
function seatToAI(seat){
  if(seatCtl[seat].kind!=='remote') return;
  const nm=NAMES[seat];
  seatCtl[seat]={kind:'ai'};
  NET.players=NET.players.filter(p=>p.seat!==seat);
  if(state && !state.over) toast(nm+' a quitté — une IA le remplace');
  const rp=remotePending[seat]; if(rp) rp.res(rp.def);
  netFlush();
}

/* ---------- matchmaking : recherche puis création automatique ---------- */
function mmStart(intent){
  if(!PeerCtor){ NET.screen='error'; NET.errMsg='PeerJS indisponible (vérifiez votre connexion internet).'; return; }
  NET.intent = (intent==='create') ? 'create' : 'search';
  NET.screen='pseudo';
  if(domIn.name){ domIn.name.value=myName; setTimeout(()=>{ try{ domIn.name.focus(); domIn.name.select&&domIn.name.select(); }catch(e){} }, 60); }
}
function netGoSearch(){
  if(NET.screen!=='pseudo') return;
  let v = domIn.name ? String(domIn.name.value||'').trim() : '';
  v = v.replace(/\s+/g,' ').slice(0,14);
  if(v){ myName=v; saveName(v); }
  mmRelaunch(NET.intent);
}
// (re)lance la recherche rapide ou la création directe, selon l'intention choisie au menu / à l'écran d'erreur
function mmRelaunch(intent){
  if(!PeerCtor){ NET.screen='error'; NET.errMsg='PeerJS indisponible (vérifiez votre connexion internet).'; return; }
  NET.intent = (intent==='create') ? 'create' : 'search';
  NET.role='off'; NET.screen='searching';
  if(NET.intent==='create'){ NET.status='Création d\'une partie…'; mmHostSlot(1); }
  else { NET.status='Recherche d\'une partie…'; mmScan(1, null, 0); }
}
function mmScan(slot, firstEmpty, cycle){
  if(NET.screen!=='searching') return;
  if(slot>MM_SLOTS){
    if(firstEmpty!=null) return mmHost(firstEmpty, cycle);
    NET.screen='error'; NET.errMsg='Toutes les tables sont pleines. Réessayez dans un instant.'; return;
  }
  NET.status='Recherche d\'une partie… (table '+slot+'/'+MM_SLOTS+')';
  const peer=new PeerCtor(undefined,{debug:0});
  let settled=false;
  const giveup=(empty)=>{ if(settled) return; settled=true; try{peer.destroy();}catch(e){}
    mmScan(slot+1, firstEmpty!=null?firstEmpty:(empty?slot:null), cycle); };
  const to=setTimeout(()=>giveup(true), NET.T.scan);
  peer.on('error', err=>{ if(err && err.type==='peer-unavailable'){ clearTimeout(to); giveup(true); }
    else if(err && (err.type==='network'||err.type==='server-error')){ clearTimeout(to); settled=true; try{peer.destroy();}catch(e){} NET.screen='error'; NET.errMsg='Serveur PeerJS injoignable.'; } });
  peer.on('open', ()=>{
    if(NET.screen!=='searching'){ try{peer.destroy();}catch(e){} return; }
    const conn=peer.connect(MM_PREFIX+slot, {reliable:true, metadata:{proto:PROTO}});
    conn.on('open', ()=>{ conn.send({t:'hello', name:myName, proto:PROTO}); });
    conn.on('data', msg=>{
      if(settled) return;
      if(msg && msg.t==='lobby'){ settled=true; clearTimeout(to); clientAdopt(peer, conn, msg); }
      else if(msg && msg.t==='deny'){ settled=true; clearTimeout(to); try{peer.destroy();}catch(e){} mmScan(slot+1, firstEmpty, cycle); }
    });
    conn.on('close', ()=>giveup(false));
  });
}
function becomeHost(peer){                                   // installe l'état d'hôte + ouvre le salon
  NET.role='host'; NET.peer=peer; NET.matchStarted=false;
  NET.players=[{seat:0, name:myName, conn:null}];
  NAMES[0]=myName;
  NET.screen='lobby'; NET.status='';
  lobbyBroadcast();
  peer.on('connection', hostOnConnection);
  peer.on('disconnected', ()=>{ try{peer.reconnect();}catch(e){} });
  startHb();
}
function mmHost(slot, cycle){
  NET.status='Création de la table '+slot+'…';
  const peer=new PeerCtor(MM_PREFIX+slot,{debug:0});
  let ok=false;
  peer.on('error', err=>{
    if(ok) return;
    if(err && err.type==='unavailable-id'){                 // quelqu'un vient de la prendre → on re-scanne
      try{peer.destroy();}catch(e){}
      if(cycle<2 && NET.screen==='searching') mmScan(1, null, cycle+1);
      else if(NET.screen==='searching'){ NET.screen='error'; NET.errMsg='Impossible de rejoindre ou de créer une table. Réessayez.'; }
    } else if(NET.screen==='searching'){ NET.screen='error'; NET.errMsg='Serveur PeerJS injoignable.'; }
  });
  peer.on('open', ()=>{
    if(NET.screen!=='searching'){ try{peer.destroy();}catch(e){} return; }
    ok=true; becomeHost(peer);
  });
  peer.on('disconnected', ()=>{ try{peer.reconnect();}catch(e){} });
}
/* ---------- création directe : on héberge sans passer par la recherche (évite le blocage) ---------- */
function mmHostSlot(slot){                                   // tente d'héberger chaque créneau, prend le premier libre
  if(NET.screen!=='searching') return;
  if(slot>MM_SLOTS){ NET.screen='error'; NET.errMsg='Toutes les tables sont occupées pour le moment. Réessayez dans un instant.'; return; }
  NET.status='Création d\'une partie… (table '+slot+'/'+MM_SLOTS+')';
  const peer=new PeerCtor(MM_PREFIX+slot,{debug:0});
  let done=false;
  peer.on('error', err=>{
    if(done) return;
    if(err && err.type==='unavailable-id'){ done=true; try{peer.destroy();}catch(e){} mmHostSlot(slot+1); }
    else if(NET.screen==='searching'){ done=true; NET.screen='error'; NET.errMsg='Serveur PeerJS injoignable.'; }
  });
  peer.on('open', ()=>{
    if(NET.screen!=='searching'){ try{peer.destroy();}catch(e){} return; }
    done=true; becomeHost(peer);
  });
}
function hostOnConnection(conn){
  conn.on('data', msg=>{
    if(!msg) return;
    if(msg.t==='hello'){
      if(msg.proto!==PROTO){ try{conn.send({t:'deny',reason:'version'});}catch(e){} setTimeout(()=>{try{conn.close();}catch(e){}},150); return; }
      if(NET.matchStarted){ try{conn.send({t:'deny',reason:'playing'});}catch(e){} setTimeout(()=>{try{conn.close();}catch(e){}},150); return; }
      if(NET.players.length>=4){ try{conn.send({t:'deny',reason:'full'});}catch(e){} setTimeout(()=>{try{conn.close();}catch(e){}},150); return; }
      let seat=1; while(NET.players.some(p=>p.seat===seat)) seat++;
      const name=String(msg.name||'Joueur').slice(0,16);
      NET.players.push({seat, name, conn});
      conn._seat=seat; conn._alive=performance.now();
      NAMES[seat]=name;
      lobbyBroadcast();
      if(NET.players.length===4) setTimeout(()=>{ if(!NET.matchStarted && NET.players.length===4) hostStartMatch(); }, 700);
      return;
    }
    const seat=conn._seat; if(seat==null) return;
    conn._alive=performance.now();
    if(msg.t==='hb') return;
    if(msg.t==='act'){ remoteActFrom(seat, msg.kind, msg.val); return; }
    if(msg.t==='uno'){ if(state && !state.over && state.current===seat && !state.saidUno[seat]){ state.saidUno[seat]=true; Sound.uno(); toast(NAMES[seat]+' annonce UNO !'); netFlush(); } return; }
    if(msg.t==='accuse'){
      if(state && state.vuln && state.vuln.player!==seat){
        if(state.vuln.phase==='open') resolveVuln(true, seat);
        else { try{conn.send({t:'tooLate'});}catch(e){} }
      }
      return;
    }
    if(msg.t==='chat'){ hostChat(NAMES[seat]||('Joueur '+seat), msg.text); return; }
    if(msg.t==='bye'){ try{conn.close();}catch(e){} return; }
  });
  conn.on('close', ()=>hostDropConn(conn));
  conn.on('error', ()=>hostDropConn(conn));
}
function hostDropConn(conn){
  const seat=conn._seat; if(seat==null) return; conn._seat=null;
  if(NET.matchStarted) seatToAI(seat);
  else { NET.players=NET.players.filter(p=>p.conn!==conn); lobbyBroadcast(); }
}
// Objectifs réglables via la barre du salon : « 1 manche » puis 100 → 1000 par pas de 50
const LOBBY_TARGETS = (function(){ const a=['round']; for(let v=100; v<=1000; v+=50) a.push(v); return a; })();
function targetLabel(t){ return t==='round' ? '1 manche' : (t+' pts'); }
function setSliderFromX(x){
  const s=L.ui.slider; if(!s) return;
  const frac=clamp((x-s.x)/s.w, 0, 1);
  const val=LOBBY_TARGETS[Math.round(frac*(LOBBY_TARGETS.length-1))];
  settings.targetSet=true;
  if(val!==settings.target){ settings.target=val; lobbyBroadcast(); }
}
function lobbyRules(){ return {stacking:settings.stacking, mix:settings.mix, target:settings.target, nomercy:!!settings.nomercy, expansion:!!settings.expansion}; }
function lobbyBroadcast(){
  const list=NET.players.map(p=>({seat:p.seat,name:p.name}));
  for(const p of NET.players){ if(!p.conn) continue;
    try{ p.conn.send({t:'lobby', you:p.seat, players:list, rules:lobbyRules()}); }catch(e){}
  }
  NET.lobby={you:0, players:list, rules:lobbyRules()};
}
function hostStartMatch(){
  if(NET.role!=='host' || NET.matchStarted || NET.players.length<2) return;
  NET.matchStarted=true; NET.screen=null;
  const used=NET.players.map(p=>p.name);
  let ai=AI_POOL.filter(n=>!used.includes(n));
  for(let s=0;s<4;s++){
    const pl=NET.players.find(p=>p.seat===s);
    if(pl){ seatCtl[s]= pl.conn?{kind:'remote'}:{kind:'local'}; NAMES[s]=pl.name; }
    else { seatCtl[s]={kind:'ai'}; NAMES[s]=ai.shift()||('Bot-'+s); }
  }
  startGame(false);
}

/* ---------- côté client : actions optimistes (le clic anime tout de suite, l'hôte confirme) ---------- */
function predictPlay(idx){
  const card=hands[0][idx]; if(!card) return;
  card._rot=(Math.random()*8-4)*Math.PI/180;
  if(card.type==='wild'||card.type==='wild4') NET.pred.wildId=card.id;
  const d=cardPos[card.id]; const src = d?{cx:d.x,cy:d.y,w:d.w,rot:d.rot}:seatTarget(0);
  const i=hands[0].indexOf(card); if(i>=0) hands[0].splice(i,1);        // retire de la main IMMÉDIATEMENT (fluide)
  NET.pred.plays[card.id]={ t:performance.now(), card };
  Sound[(card.color==='wild'||card.type!=='number')?'special':'play']();
  animate({ type:'card', faceDown:false, key:spriteKey(card), toTop:true,   // vol optimiste vers la défausse dès le clic
    cx0:src.cx, cy0:src.cy, cx1:L.discard.x+L.discard.w/2, cy1:L.discard.y+L.discard.h/2,
    w0:src.w||L.cw, w1:L.cw, r0:src.rot||0, r1:card._rot, dur:260,
    onEnd:()=>{ if(!discard.find(dd=>dd.id===card.id)) discard.push(card); } });
}
function predictDraw(){
  NET.pred.draw++;
  if(state.drawCountView!=null && state.drawCountView>0) state.drawCountView--;
  Sound.draw();
  const tgt=seatTarget(0);
  animate({ type:'card', faceDown:true, key:'back',
    cx0:L.draw.x+L.draw.w/2, cy0:L.draw.y+L.draw.h/2, cx1:tgt.cx, cy1:tgt.cy,
    w0:L.cw, w1:tgt.w, r0:0, r1:0, dur:230 });
  NET.pred.drawSched={ t0:performance.now(), stag:0, dur:230 };   // chaque vraie carte se pose à l'atterrissage de SON dos
}
function predictDrawPile(n){                                 // encaisse une pile de + : vol immédiat côté client (simultané avec l'hôte)
  NET.pred.draw++;                                           // un seul événement 'draw' (avec n cartes) sera consommé
  state.pendingDraw=0; state.pendingKind=null; state.pendingUnit=0;   // pile encaissée (optimiste)
  const tgt=seatTarget(0), dur=(n>2?150:230), stag=Math.min(dur, 150);
  for(let k=0;k<n;k++){
    setTimeout(()=>{ if(!state) return;
      Sound.draw();
      animate({ type:'card', faceDown:true, key:'back',
        cx0:L.draw.x+L.draw.w/2, cy0:L.draw.y+L.draw.h/2, cx1:tgt.cx, cy1:tgt.cy,
        w0:L.cw, w1:tgt.w, r0:0, r1:0, dur });
    }, k*stag);
  }
  NET.pred.drawSched={ t0:performance.now(), stag, dur };    // chaque carte se pose à l'atterrissage de son dos → une par une, en direct
}
function predictRecolor(color){
  const id=NET.pred.wildId; if(!id) return;
  const pr=NET.pred.plays[id]; const c=pr?pr.card:discard.find(d=>d.id===id);
  if(c){ c.chosenColor=color; delete c.__key; }            // la variante colorée s'affiche immédiatement
  state.currentColor=color;
  NET.pred.wildId=null;
}
function netPredict(kind, val){
  try{
    if(kind==='turn'){
      if(val && val.type==='play') predictPlay(val.idx);
      else if(val && val.type==='draw'){ if(state.pendingDraw>0) predictDrawPile(state.pendingDraw); else predictDraw(); }
      else if(val && val.type==='token' && val.face==='arm'){ if(state.tokens && state.tokens[0]) state.tokens[0].armed=!state.tokens[0].armed; }   // affiche l'armement tout de suite
    } else if(kind==='drewPlayable' && val && val.type==='play') predictPlay(val.idx);
    else if(kind==='color'){ predictRecolor(val); if(state) state.phase='resolving'; }   // referme le sélecteur de couleur tout de suite
    else if(kind==='challenge'){ if(state){ state.chal=null; state.phase='resolving'; } }   // referme le panneau de contestation tout de suite
    else if(kind==='tokenChoice'){ if(state) state.phase='resolving'; }   // referme l'écran de choix tout de suite
  }catch(e){}
}

/* ---------- côté client ---------- */
function clientAdopt(peer, conn, lobbyMsg){
  NET.role='client'; NET.peer=peer; NET.conn=conn; NET.screen='lobby';
  NET.lobby={you:lobbyMsg.you, players:lobbyMsg.players, rules:lobbyMsg.rules};
  NET.lastSeen=performance.now();
  conn.on('data', clientOnData);
  conn.on('close', clientLost);
  conn.on('error', clientLost);
  startHb();
}
function clientOnData(msg){
  NET.lastSeen=performance.now();
  if(!msg) return;
  if(msg.t==='hb') return;
  if(msg.t==='lobby'){ NET.lobby={you:msg.you, players:msg.players, rules:msg.rules}; return; }
  if(msg.t==='chatMsg'){ chatPush(String(msg.from||'?').slice(0,16), String(msg.text||'').slice(0,120)); return; }
  if(msg.t==='tooLate'){ centerMessage("Vous n'avez pas protesté le UNO de ce joueur à temps.\nIl n'est pas pénalisé.", THEME.bad); return; }
  if(msg.t==='bye' || msg.t==='deny'){ clientLost(); return; }
  if(msg.t==='q'){ NET.q.push(msg); pumpQ(); return; }
}
async function pumpQ(){
  if(NET.busy) return; NET.busy=true;
  while(NET.q.length){
    const msg=NET.q.shift();
    try{
      if(msg.evs) for(const ev of msg.evs) await handleNetEv(ev);
      if(msg.view && state) applyView(msg.view);
    }catch(err){}
  }
  NET.busy=false;
}
async function handleNetEv(ev){
  switch(ev.ev){
    case 'roundStart': await clientRoundStart(ev); break;
    case 'toast': toastState={msg:ev.msg, t:performance.now()}; live.textContent=ev.msg; break;
    case 'uno': Sound.uno(); break;
    case 'cmsg': if(state){ state.centerMsg={ text:ev.text, color:ev.color, t0:performance.now(), until:performance.now()+(ev.ms||2800) }; } break;
    case 'tokenface': if(state && state.tokens && state.tokens[ev.seat]){ state.tokens[ev.seat].face=ev.face; animateTokenArrive(ev.seat, ev.face); } break;   // arrivée du jeton
    case 'reveal_hand': if(state) showFinalReveal(ev.seat, ev.cards); break;   // Attaque Finale : révélation animée
    case 'tokenuse': if(state){ if(state.tokens && state.tokens[ev.seat]){ state.tokens[ev.seat].used=true; state.tokens[ev.seat].armed=false; } animateTokenUse(ev.seat, ev.face); } break;   // usage : anim + son
    case 'play': if(state) await clientPlay(ev.seat, unpackCard(ev.card)); break;
    case 'recolor': { const c=discard.find(d=>d.id===ev.card.id); if(c){ const u=unpackCard(ev.card); Object.assign(c,u); } break; }
    case 'draw': if(state) await clientDrawAnim(ev.seat, ev.n, ev.cards); break;
    case 'drawall': if(state) await clientFlyToDiscard(ev.seat, ev.cards, {below:true, faceUp:true, sound:'special'}); break;   // Défausse tout : vol carte par carte
    case 'mercy_dump': if(state) await clientFlyToDiscard(ev.seat, ev.cards, {below:true, faceUp:true, sound:'special', dur:200}); break;   // élimination : dump animé sous la carte du dessus
    case 'handspass': if(state) await clientPassHands(ev.dir, ev.myNewHand, ev.counts); break;   // 0 : toutes les mains tournent (animé)
    case 'swap': if(state) await clientSwap(ev.a, ev.b, ev.myNewHand, ev.counts); break;   // 7 : échange animé des deux mains
    case 'roulette_reveal': if(state) await clientRevealToHand(ev.seat, ev.cards, ev.color); break;   // Roulette : révélation face visible carte par carte
    case 'eliminated': if(state){ Sound.error(); if(state.eliminated) state.eliminated[ev.seat]=true; } break;
    case 'reveal': {
      if(!state) break;
      for(let k=1;k<4;k++) hands[k]=ev.hands[k].map(unpackCard);
      state.revealing=true; state.revealStart=prefersReduced?-1e9:performance.now();
      let mx=0; for(let k=1;k<4;k++) mx=Math.max(mx,hands[k].length);
      Sound.win();
      if(mx>0 && !prefersReduced){ await sleep((mx-1)*REVEAL_STAGGER+REVEAL_FLIP+320); }
      break; }
  }
}
async function clientRoundStart(ev){
  runToken++; const myToken=runToken;
  anims=[]; pending=null; cardPos={}; skipDeal=false; inMenu=false; NET.screen=null;
  NET.pred={ plays:{}, draw:0 };
  for(let k=0;k<4;k++){ NAMES[k]=ev.names[k]; scores[k]=ev.scores[k]; }
  hands=[[],[],[],[]];
  hands[0]=ev.myHand.map(unpackCard);
  for(let s=1;s<4;s++){ for(let i=0;i<ev.counts[s];i++) hands[s].push({id:'op'+s+'_'+(CARD_ID++)}); }
  discard=[]; drawPile=[];
  state={ current:1, dir:1, currentColor:null, nomercy:!!ev.nomercy, expansion:!!ev.expansion,
    tokens:!!ev.expansion ? [0,1,2,3].map(()=>({face:null,used:false,armed:false})) : null,
    phase:'dealing', dealing:true, revealed:[0,0,0,0],
    over:false, winner:-1, hoverIdx:-1, turnCounter:0, drewCard:null, chal:null,
    saidUno:[false,false,false,false], vuln:null, centerMsg:null,
    stacking:ev.stacking, mix:ev.mix, pendingDraw:0, pendingKind:null, pendingUnit:0,
    eliminated:[false,false,false,false], swapOptions:null, roulette:null, swapFx:null,
    target:ev.target, roundPoints:0, breakdown:null, gameWon:false,
    revealing:false, revealStart:0, awaitSeat:-1, awaitKind:null, drawCountView:ev.drawCount };
  toast('Distribution…');
  await dealAnimation(unpackCard(ev.first), myToken);
  if(myToken!==runToken) return;
  state.dealing=false; if(discard.length) state.currentColor=effColor(top());
}
async function clientPlay(seatVi, card){
  if(seatVi===0 && NET.pred.plays[card.id]){
    const pr=NET.pred.plays[card.id]; delete NET.pred.plays[card.id];
    Object.assign(pr.card, card);                          // champs autoritaires (rotation, couleur choisie, sprite)
    if(!discard.includes(pr.card) && !discard.find(d=>d.id===card.id)) discard.push(pr.card);
    return;                                                // déjà animé au clic (optimiste)
  }
  let src=null;
  if(seatVi===0){
    const i=hands[0].findIndex(c=>c.id===card.id);
    if(i>=0){ const d=cardPos[hands[0][i].id]; if(d) src={cx:d.x,cy:d.y,w:d.w,rot:d.rot}; hands[0].splice(i,1); }
  } else if(hands[seatVi].length){
    const ph=hands[seatVi].pop(); const d=cardPos[ph.id]; if(d) src={cx:d.x,cy:d.y,w:d.w,rot:d.rot};
  }
  if(!src) src=seatTarget(seatVi);
  Sound[(card.color==='wild'||card.type!=='number')?'special':'play']();
  await animate({ type:'card', faceDown:false, key:spriteKey(card), toTop:true,
    cx0:src.cx, cy0:src.cy, cx1:L.discard.x+L.discard.w/2, cy1:L.discard.y+L.discard.h/2,
    w0:src.w||L.cw, w1:L.cw, r0:src.rot||0, r1:card._rot||0, dur:260,
    onEnd:()=>{ if(!discard.includes(card)) discard.push(card); } });
}
async function clientSwapFlourish(a,b){                     // 7 (client) : dos de cartes croisés entre 2 sièges — la vue rétablit les mains
  Sound.special();
  if(prefersReduced || a==null || b==null) return;
  const A=seatTarget(a), B=seatTarget(b), proms=[];
  for(let i=0;i<4;i++){
    const off=(i-1.5)*9;
    proms.push(animate({type:'card', faceDown:true, key:'back', cx0:A.cx+off,cy0:A.cy, cx1:B.cx+off,cy1:B.cy, w0:L.ocw,w1:L.ocw, r0:0,r1:0, dur:300}));
    proms.push(animate({type:'card', faceDown:true, key:'back', cx0:B.cx-off,cy0:B.cy, cx1:A.cx-off,cy1:A.cy, w0:L.ocw,w1:L.ocw, r0:0,r1:0, dur:300}));
  }
  await Promise.all(proms);
}
// ---------- Parité d'animation No Mercy côté client (mêmes vols qu'en solo) ----------
function fillPlaceholders(seatVi, n){ hands[seatVi]=[]; for(let i=0;i<(n||0);i++) hands[seatVi].push({id:'op'+seatVi+'_'+(CARD_ID++)}); }
async function clientFlyToDiscard(seatVi, cardsPacked, opt){   // cartes d'un siège → défausse (Défausse tout, dump d'élimination)
  opt=opt||{};
  const below=(opt.below!==false), faceUp=(opt.faceUp!==false);
  const cards=(cardsPacked||[]).map(unpackCard);
  if(!cards.length) return;
  const removeFromHand=()=>{
    if(seatVi===0){ for(const c of cards){ const i=hands[0].findIndex(h=>h.id===c.id); if(i>=0) hands[0].splice(i,1); } }
    else { for(let k=0;k<cards.length && hands[seatVi].length; k++) hands[seatVi].pop(); }
  };
  if(prefersReduced){ removeFromHand(); for(const c of cards) insertDiscard(c, below); return; }
  const rects=layoutHand(seatVi, hands[seatVi].length);
  const srcs=cards.map((c,i)=>{
    let idx=hands[seatVi].findIndex(h=>h.id===c.id);         // siège 0 : vraie carte par id ; adversaire : slot i
    if(idx<0) idx=Math.min(i, Math.max(0,hands[seatVi].length-1));
    const r=(idx>=0 && rects[idx]) ? rects[idx] : seatTarget(seatVi);
    return {cx:r.cx, cy:r.cy, w:r.w||(seatVi===0?L.cw:L.ocw), rot:r.rot||0};
  });
  removeFromHand();
  const STAG=clamp(480/cards.length,16,55), DUR=Math.max(150,opt.dur||220), base=discardDropCenter();
  Sound[opt.sound||'special']();
  const tok=runToken;
  const proms=cards.map((c,i)=>new Promise(res=>setTimeout(()=>{
    if(!state||tok!==runToken){ res(); return; }
    animate({ type:'card', faceDown:!faceUp, key:faceUp?spriteKey(c):'back',
      cx0:srcs[i].cx, cy0:srcs[i].cy, cx1:base.cx, cy1:base.cy,
      w0:srcs[i].w, w1:L.cw, r0:srcs[i].rot, r1:base.rot, dur:DUR,
      onEnd:()=>{ if(state&&tok===runToken) insertDiscard(c, below); res(); } });
  }, i*STAG)));
  await Promise.all(proms);
}
async function clientRevealToHand(seatVi, cardsPacked, color){   // Roulette : révélation face visible carte par carte
  const cards=(cardsPacked||[]).map(unpackCard);
  if(!cards.length){ Sound.special(); return; }
  if(prefersReduced){ for(const c of cards){ if(seatVi===0) hands[0].push(c); else hands[seatVi].push({id:'op'+seatVi+'_'+(CARD_ID++)}); } return; }
  const tok=runToken;
  for(const c of cards){
    const match=(effColor(c)===color), tgt=seatTarget(seatVi);
    Sound[match?'special':'draw']();
    await animate({ type:'card', faceDown:false, key:spriteKey(c),
      cx0:L.draw.x+L.draw.w/2, cy0:L.draw.y+L.draw.h/2, cx1:tgt.cx, cy1:tgt.cy,
      w0:L.cw, w1:tgt.w, r0:0, r1:tgt.rot, dur:match?300:200,
      onEnd:()=>{ if(state&&tok===runToken){ if(seatVi===0){ hands[0].push(c); cardPos[c.id]={x:tgt.cx,y:tgt.cy,w:tgt.w,rot:tgt.rot}; } else hands[seatVi].push({id:'op'+seatVi+'_'+(CARD_ID++)}); } } });
    if(!state) return;
  }
}
async function clientPassHands(dir, myNewHandPacked, counts){    // Carte 0 : toutes les mains en jeu tournent (sens du jeu)
  const myNew=(myNewHandPacked||[]).map(unpackCard);
  counts=counts||[myNew.length,0,0,0];
  const alive=[0,1,2,3].filter(k=>!state.eliminated || !state.eliminated[k]);
  if(prefersReduced || alive.length<2){ hands[0]=myNew; for(let s=1;s<4;s++) fillPlaceholders(s, counts[s]||0); return; }
  const nextAlive=s=>{ let j=(s+dir+4)%4,g=0; while(alive.indexOf(j)<0 && g++<8) j=(j+dir+4)%4; return j; };
  const prevOf={}; for(const s of alive) prevOf[nextAlive(s)]=s;   // le siège d reçoit la main de prevOf[d]
  const oldSlots={}; for(const s of alive) oldSlots[s]=layoutHand(s, hands[s].length);
  const newSlots={}; for(const d of alive) newSlots[d]=layoutHand(d, counts[d]||0);
  const flights=[];
  for(const d of alive){
    const src=prevOf[d], n=counts[d]||0;
    for(let i=0;i<n;i++){
      const from=(oldSlots[src]&&oldSlots[src][i])||seatTarget(src);
      const to=(newSlots[d]&&newSlots[d][i])||seatTarget(d);
      const faceUp=(d===0);
      flights.push({from,to,faceUp,key:faceUp?spriteKey(myNew[i]):'back',
        w0:from.w||(src===0?L.cw:L.ocw), w1:to.w||(d===0?L.cw:L.ocw)});
    }
  }
  hands[0]=[]; for(let s=1;s<4;s++) hands[s]=[];               // mains vides pendant les vols (comme animateDealInto)
  Sound.special();
  const tok=runToken, STAG=clamp(300/Math.max(1,flights.length),8,32), DUR=260;
  const proms=flights.map((f,i)=>new Promise(res=>setTimeout(()=>{
    if(!state||tok!==runToken){ res(); return; }
    animate({ type:'card', faceDown:!f.faceUp, key:f.key, cx0:f.from.cx, cy0:f.from.cy, cx1:f.to.cx, cy1:f.to.cy,
      w0:f.w0, w1:f.w1, r0:f.from.rot||0, r1:f.to.rot||0, dur:DUR, onEnd:res });
  }, i*STAG)));
  await Promise.all(proms);
  if(!state||tok!==runToken) return;
  hands[0]=myNew; for(const d of alive){ if(d!==0) fillPlaceholders(d, counts[d]||0); }
}
async function clientSwap(aVi, bVi, myNewHandPacked, counts){    // Carte 7 : échange de deux mains
  if((aVi===0 || bVi===0) && myNewHandPacked){                  // je suis concerné → vol riche des deux mains
    const otherVi=(aVi===0)?bVi:aVi;
    const myNew=(myNewHandPacked||[]).map(unpackCard);
    const otherNew=(counts?counts[otherVi]:hands[otherVi].length);   // = mon ancien nombre de cartes
    if(prefersReduced){ hands[0]=myNew; fillPlaceholders(otherVi, otherNew); return; }
    const myOld=hands[0].slice();
    const myOldSlots=layoutHand(0, myOld.length), otherOldSlots=layoutHand(otherVi, hands[otherVi].length);
    const myNewSlots=layoutHand(0, myNew.length), otherNewSlots=layoutHand(otherVi, myOld.length);
    hands[0]=[]; hands[otherVi]=[];
    Sound.special();
    const tok=runToken, proms=[];
    myOld.forEach((c,i)=>{ const from=myOldSlots[i]||seatTarget(0), to=otherNewSlots[i]||seatTarget(otherVi);   // mes cartes → l'autre (dos)
      proms.push(new Promise(res=>setTimeout(()=>{ if(!state||tok!==runToken){res();return;}
        animate({type:'card',faceDown:true,key:'back',cx0:from.cx,cy0:from.cy,cx1:to.cx,cy1:to.cy,w0:from.w||L.cw,w1:to.w||L.ocw,r0:from.rot||0,r1:to.rot||0,dur:300,onEnd:res}); }, i*18))); });
    myNew.forEach((c,i)=>{ const from=otherOldSlots[i]||seatTarget(otherVi), to=myNewSlots[i]||seatTarget(0);   // ses cartes → moi (face visible)
      proms.push(new Promise(res=>setTimeout(()=>{ if(!state||tok!==runToken){res();return;}
        animate({type:'card',faceDown:false,key:spriteKey(c),cx0:from.cx,cy0:from.cy,cx1:to.cx,cy1:to.cy,w0:from.w||L.ocw,w1:to.w||L.cw,r0:from.rot||0,r1:to.rot||0,dur:300,onEnd:res}); }, i*18))); });
    await Promise.all(proms);
    if(!state||tok!==runToken) return;
    hands[0]=myNew; fillPlaceholders(otherVi, otherNew);
  } else {
    await clientSwapFlourish(aVi, bVi);                         // deux adversaires : flourish de dos croisés
  }
}
async function clientDrawAnim(seatVi, n, cards){
  if(seatVi===0 && cards && NET.pred.draw>0){
    NET.pred.draw=Math.max(0, NET.pred.draw-1);
    const tok=runToken, tgt=seatTarget(0);
    const sched=NET.pred.drawSched||{ t0:performance.now(), stag:150, dur:150 };
    cards.forEach((pc,k)=>{                                  // chaque carte se pose quand SON dos atterrit (une par une, en direct)
      const card=unpackCard(pc);
      const landAt=sched.t0 + k*sched.stag + sched.dur;
      const delay=Math.max(0, landAt - performance.now());
      const place=()=>{ if(!state||tok!==runToken) return;
        if(!hands[0].find(h=>h.id===card.id)){ hands[0].push(card); cardPos[card.id]={x:tgt.cx,y:tgt.cy,w:tgt.w,rot:0}; } };  // dedup si la vue a déjà posé
      if(delay>10) setTimeout(place, delay); else place();
    });
    return;
  }
  if(seatVi===0 && cards){
    for(const pc of cards){
      const card=unpackCard(pc); Sound.draw(); const tgt=seatTarget(0);
      await animate({ type:'card', faceDown:true, key:'back',
        cx0:L.draw.x+L.draw.w/2, cy0:L.draw.y+L.draw.h/2, cx1:tgt.cx, cy1:tgt.cy,
        w0:L.cw, w1:tgt.w, r0:0, r1:0, dur:(cards.length>2?150:230),
        onEnd:()=>{ hands[0].push(card); cardPos[card.id]={x:tgt.cx,y:tgt.cy,w:tgt.w,rot:0}; } });
    }
  } else {
    for(let k=0;k<n;k++){
      Sound.draw(); const tgt=seatTarget(seatVi);
      await animate({ type:'card', faceDown:true, key:'back',
        cx0:L.draw.x+L.draw.w/2, cy0:L.draw.y+L.draw.h/2, cx1:tgt.cx, cy1:tgt.cy,
        w0:L.cw, w1:tgt.w, r0:0, r1:tgt.rot, dur:(n>2?150:230),
        onEnd:()=>{ hands[seatVi].push({id:'op'+seatVi+'_'+(CARD_ID++)}); } });
    }
  }
}
function applyView(v){
  for(let k=0;k<4;k++){ NAMES[k]=v.names[k]; scores[k]=v.scores[k]; }
  hands[0]=v.myHand.map(unpackCard).filter(c=>{
    const pr=NET.pred.plays[c.id]; if(!pr) return true;
    if(performance.now()-pr.t>4000){ delete NET.pred.plays[c.id]; return true; }   // rejet hôte : la carte revient
    return false;                                                                   // en vol vers la défausse (optimiste)
  });
  if(!v.revealing){
    for(let s=1;s<4;s++){
      const want=v.counts[s], h=hands[s];
      while(h.length>want) h.pop();
      while(h.length<want) h.push({id:'op'+s+'_'+(CARD_ID++)});
    }
  }
  discard=v.top4.map(unpackCard);
  state.nomercy=!!v.nomercy; state.expansion=!!v.expansion;
  if(v.tokens) state.tokens=v.tokens.map(t=>({face:t.face, used:t.used, armed:t.armed})); else if('tokens' in v) state.tokens=null;
  if(v.elim && state.eliminated){ for(let k=0;k<4;k++) state.eliminated[k]=v.elim[k]; }
  state.dealing=v.dealing; state.current=v.current; state.dir=v.dir; state.currentColor=v.currentColor;
  state.pendingDraw=v.pendingDraw; state.pendingKind=v.pendingKind; state.pendingUnit=v.pendingUnit||0;
  state.stacking=v.stacking; state.mix=v.mix; state.target=v.target;
  state.drawCountView=v.drawCount;
  state.saidUno[0]=v.saidMe;
  state.vuln = v.vuln ? {player:v.vuln.player, phase:v.vuln.phase} : null;
  state.over=v.over; state.gameWon=v.gameWon; state.winner=v.winner; state.roundPoints=v.roundPoints;
  state.elimBonus=v.elimBonus||0; state.elimCount=v.elimCount||0;
  state.revealing = v.revealing || (state.revealing && v.over);
  state.chal=null; state.drewCard=null; state.swapOptions=null;
  if(v.await){
    const kind=v.await.kind;
    if(kind==='turn') state.phase='human';
    else if(kind==='drewPlayable'){ state.phase='drewPlayable'; state.drewCard=hands[0].find(c=>c.id===v.await.drewId)||null; }
    else if(kind==='color') state.phase=(v.await.roulette?'rouletteColor':'chooseColor');
    else if(kind==='challenge'){ state.phase='challengePrompt'; state.chal={by:v.await.chalBy}; }
    else if(kind==='swap'){ state.phase='chooseSwap'; state.swapOptions=v.await.swap||[]; }
    else if(kind==='tokenChoice') state.phase='tokenChoice';
    if(!pending || pending.kind!==kind) pending={kind, net:true, res:(val)=>{ netPredict(kind, val); NET.send({t:'act', kind, val}); }};
    if(kind==='turn') clientMaybeAutoDraw();
  } else {
    if(pending && pending.net) pending=null;
    state.phase = v.over ? 'over' : (v.dealing ? 'dealing' : 'ai');
  }
}
// Côté client (joueur distant) : pioche automatique si aucun coup possible (sauf dénonciation « pas dit UNO » en cours)
function clientMaybeAutoDraw(){
  if(NET.role!=='client' || !pending || pending.kind!=='turn' || !state) return;
  if(state.vuln && state.vuln.phase==='open' && state.vuln.player!==0) return;   // dénoncer reste une action
  if(state.tokens && !state.tokens[0].used && state.tokens[0].face==='mercy' && hands[0].length>=18) return;   // grosse main + Mercy → choix laissé au joueur
  if(seatHasMove(0)) return;
  setTimeout(()=>{ if(NET.role==='client' && pending && pending.kind==='turn' && state && !state.over && state.current===0 && !seatHasMove(0) && !(state.tokens && !state.tokens[0].used && state.tokens[0].face==='mercy' && hands[0].length>=18)) resolvePending({type:'draw'}); }, 620);
}
NET.send=function(msg){ try{ if(NET.conn && NET.conn.open!==false) NET.conn.send(msg); }catch(e){} };
function clientLost(){
  if(NET.role!=='client') return;
  const inGame = !inMenu && state;
  stopNet(false);
  if(inGame){ centerMessage('Connexion à l\'hôte perdue.', THEME.bad); setTimeout(goMenuFromNet, 2200); }
  else goMenuFromNet();
}
function goMenuFromNet(){ runToken++; state=null; pending=null; inMenu=true; NET.screen=null; resetSeats(); }
function resetSeats(){ seatCtl=[{kind:'local'},{kind:'ai'},{kind:'ai'},{kind:'ai'}]; NAMES[0]='Vous'; NAMES[1]='Colt'; NAMES[2]='Rosa'; NAMES[3]='Django'; }
function stopNet(bye){
  if(NET.hbT){ clearInterval(NET.hbT); NET.hbT=null; }
  if(NET.role==='host'){ for(const p of NET.players){ if(p.conn){ try{ if(bye) p.conn.send({t:'bye'}); }catch(e){} try{ p.conn.close(); }catch(e){} } } }
  if(NET.conn){ try{ if(bye) NET.conn.send({t:'bye'}); }catch(e){} try{ NET.conn.close(); }catch(e){} }
  if(NET.peer){ try{ NET.peer.destroy(); }catch(e){} }
  NET.role='off'; NET.peer=null; NET.conn=null; NET.players=[]; NET.lobby=null;
  NET.matchStarted=false; NET.rawEvs=[]; NET.q=[]; NET.busy=false; NET.chat=[];
  NET.pred={ plays:{}, draw:0 };
  for(const k in remotePending){ const rp=remotePending[k]; delete remotePending[k]; if(rp){ clearTimeout(rp.timer); rp.res(rp.def); } }
}
NET.leave=function(){ stopNet(true); goMenuFromNet(); };
function startHb(){
  if(NET.hbT) clearInterval(NET.hbT);
  NET.lastSeen=performance.now();
  NET.hbT=setInterval(()=>{
    const now=performance.now();
    if(NET.role==='client'){
      NET.send({t:'hb'});
      if(now-NET.lastSeen>NET.T.dead) clientLost();
    } else if(NET.role==='host'){
      for(const p of NET.players.slice()){
        if(!p.conn) continue;
        try{ p.conn.send({t:'hb'}); }catch(e){}
        if(p.conn._alive && now-p.conn._alive>NET.T.dead){ try{p.conn.close();}catch(e){} hostDropConn(p.conn); }
      }
    }
  }, NET.T.hb);
}

function segBtn(name,x,y,w,h,title,sub,sel){
  L.buttons[name]={x,y,w,h};
  roundRect(x,y,w,h,12);
  if(sel){ ctx.save(); ctx.shadowColor=THEME.gold; ctx.shadowBlur=12; ctx.fillStyle='rgba(245,197,24,0.14)'; ctx.fill(); ctx.restore(); roundRect(x,y,w,h,12); ctx.strokeStyle=THEME.gold; ctx.lineWidth=2; ctx.stroke(); }
  else { ctx.fillStyle='rgba(255,255,255,0.03)'; ctx.fill(); roundRect(x,y,w,h,12); ctx.strokeStyle='rgba(255,255,255,0.12)'; ctx.lineWidth=1.5; ctx.stroke(); }
  ctx.textAlign='center';
  ctx.textBaseline='middle'; ctx.fillStyle=sel?THEME.gold:THEME.text; ctx.font="700 15px 'Fredoka',sans-serif"; ctx.fillText(title, x+w/2, y+h/2-7);
  ctx.fillStyle=THEME.sub; ctx.font="500 10.5px 'Space Grotesk',sans-serif"; ctx.fillText(sub, x+w/2, y+h/2+11);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}
function drawLobbySlider(x, y, w){
  const n=LOBBY_TARGETS.length;
  const idx=Math.max(0, LOBBY_TARGETS.indexOf(settings.target));
  const knobX=x + (idx/(n-1))*w;
  L.buttons['rule_slider']={x:x-12, y:y-16, w:w+24, h:32};
  L.ui.slider={x, y, w};
  ctx.lineCap='round';
  ctx.strokeStyle='rgba(255,255,255,0.16)'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+w,y); ctx.stroke();
  ctx.strokeStyle=THEME.gold; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(knobX,y); ctx.stroke();
  ctx.save(); ctx.shadowColor=THEME.gold; ctx.shadowBlur=10; ctx.beginPath(); ctx.arc(knobX,y,11,0,Math.PI*2); ctx.fillStyle=THEME.gold; ctx.fill(); ctx.restore();
  ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(knobX,y,11,0,Math.PI*2); ctx.stroke();
}

function wrapTextCentered(text,cx,y,maxW,lh){
  text=T(text);
  const words=text.split(' '); let line='';
  for(const wd of words){ const t=line?line+' '+wd:wd;
    if(ctx.measureText(t).width>maxW && line){ ctx.fillText(line,cx,y); line=wd; y+=lh; } else line=t; }
  if(line) ctx.fillText(line,cx,y);
}

/* ============================================================
   Boot : charge la planche puis démarre
   ============================================================ */
function boot(){
  const img=new Image();
  img.onload=()=>{
    SHEET=img;
    document.getElementById('boot').style.display='none';
    initDomInputs();
    resize();
    requestAnimationFrame(frame);
    inMenu=true;                    // ouvre l'écran de création de partie
    const nm=new Image(); nm.onload=()=>{ SHEET_NM=nm; if(state&&state.nomercy) buildCardCache(); }; nm.src=SHEET_SRC_NM;   // planche No Mercy en tâche de fond
    const ex=new Image(); ex.onload=()=>{ SHEET_NM_EXP=ex; if(state&&state.nomercy) buildCardCache(); }; ex.src=SHEET_SRC_NM_EXP;   // planche extension en tâche de fond
    const tk=new Image(); tk.onload=()=>{ SHEET_TOKEN=tk; }; tk.src=SHEET_SRC_TOKEN;   // jetons en tâche de fond
  };
  img.onerror=()=>{ const s=document.querySelector('#boot .s'); if(s) s.textContent=T('Image introuvable : placez « spritesheetunoclassique.png » dans le dossier « images/ » à côté du jeu.'); };
  img.src=SHEET_SRC;
}
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(()=>{ fontsReady=true; }); }
boot();
})();
